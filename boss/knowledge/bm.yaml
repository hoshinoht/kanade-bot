boss: BM
summary: Black Mage is a curse-management fight over four phases with 12 lives each; never take a Creation and a Destruction hit within 6 seconds of each other, solve the Phase 2 and 3 full-map checks by position, then hold the right Phase 4 affinity.
core:
- 'Hits apply the Curse of Creation (also called Creative Curse; white: heal-over-time, -10% damage, burning aura) or the Curse of Destruction (also called Destructive Curse; black: +15% damage taken, +10% damage, no potions) for 6s. Taking the opposite curse while one is active costs a life, deals +50% HP damage and seals skills for 5s.'
- 'Phase 1: Aion of Creation (also called Aeonian Rise; white curse) and Yaldabaoth of Destruction (also called Tanadian Ruin; black curse) share one HP bar. Walls close in from the edges and spawning on you is lethal, so avoid corners; Red Lightning cages you for 15s.'
- 'Phase 2: dodge the chain volleys first. For the full-map Laser Jail, a left-hand (red) charge means stand at the far left, right-hand (purple) the far right, both hands directly under him (watch his touch knockback).'
- 'Phase 3: stay inside his shield bubble (outside it you deal half damage). His Creation ultimate (white snowfall) is survived under a platform; Destruction (floor vortex) is survived standing on a platform, ideally the farthest. Crouch to avoid his Push.'
- 'Phase 4: party members are hidden. The Harvest key swaps your affinity: Creation ignores white attacks, Destruction ignores black ones. Every 30s a pillar check kills anyone on the wrong colour, then he regains a barrier.'
- Only Origin skills can bind Black Mage from Phase 2 onward; normal binds still work on the Phase 1 knights.
danger:
- Curse crossing removes a life without a normal death and is the main way runs fail.
- Phase 2 and 3 full-map attacks and Phase 1 wall spawns are instant kills when positioned wrong; walking into Red Lightning is near-lethal, and lethal while you hold the Curse of Destruction.
- An Origin bind in Phase 2 can hide which hand is charging Laser Jail; know the timer instead.
- Phase 3 Push, pull and lasers can chain curses; stop attacking when pink lasers appear and avoid double-jumping near him.
- In Phase 4, bullets and explosions are the main life drains, and nobody can see your mistakes to call them.
tips:
- Before taking any intentional hit, check which curse you currently have.
- In Phase 1, bind and burst when both knights overlap; their dive makes them briefly untargetable, so bind only when sure.
- In Phase 4, default to Destruction so you are immune to black attacks and can still use potions; swap only for pillar checks.
- After the final kill, break the Egg of the Beginning (also called Genesis Crux) with basic attacks to collect rewards; the clear counts on the last-phase kill (MapleSEA v214).
difficulty_notes:
  x: Extreme forces your Phase 4 affinity to swap every 30 seconds after a warning, and has a 30 minute limit instead of Hard's 60 (before OVERDRIVE).
notes:
- HP rows are KMS values before OVERDRIVE, which match MapleSEA now. Clears are monthly, shared between Hard and Extreme. Arcane Force 1320 (+10% final damage at 1452, +30% at 1716, +50% at 1980).
- 'MapleSEA changes: v244 stopped the Phase 3 Creation ultimate overlapping the absorption pattern; v246 removed the entry item; v249 removed Dark Falling and Morning Starfall from Phases 2 and 3.'
- Entry level 255 per the wiki and guides; MapleTools lists 275 (unconfirmed which is right).
