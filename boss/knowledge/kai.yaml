boss: Kai
event:
  name: Challengers World Season 3
  availability: 'MapleSEA: ran in Challengers World Season 3 only, from 3 Jun 2026 (after the v251 patch) until it ended at the 30 Sep 2026 maintenance; solo only. Not currently available.'
summary: 'Time Wanderer Kai is a solo dodging fight: bank Chrono Gauge, spend it on Chrono Break during Time Distortion, and reach 10,000 Fever for big cooldown refunds and a groggy window.'
core:
- Solo only, with a 20-minute limit and 5 lives. One HP bar; at 50% damage pauses while he transforms into Phase 2. One clear per week per Maple ID (resets Wednesday 23:59 SGT), separate from the weekly boss clear limit.
- Chrono Gauge (max 1000) refills 24 per second while Chrono Break is off and drops when you are hit.
- When the side timer expires Kai enters Time Distortion (about 20s, stretched to about 33s by Chrono Break). His attacks there are too fast to react to without Chrono Break (Tab by default), which costs 90 Chrono Gauge to start and 30 per second after 3s.
- Chrono Step (Space by default) is a dodge similar to FA's parry but with no damage reward. It holds 3 charges on a 5s recharge, and a successful dodge during Chrono Break refunds one charge. Hold down while using it to dodge in place.
- 'Fever Count rises during Time Distortion and drops when you are hit. At the end: 6,000 cuts all cooldowns by 10s, 8,000 by 20s, 10,000 by 40s plus a 10s groggy.'
- He cannot be bound during Time Distortion or groggy (Origin absolute binds excepted). Reaching 50% HP mid-Distortion ends it early with a partial refund.
danger:
- 'Phase 1 Holographic Afterimage: three sets of four strikes, then a noticeably delayed final strike; the hardest Phase 1 pattern.'
- Time Distortion lasers cost the most Fever; a single hit on Hard can rule out 10,000.
- Phase 2 High Speed Slash throws about 126 slashes, and Chrono Step refunds are capped at five during it.
- Green laser walls guard both map edges, so do not camp corners.
- On Hard, Swiftness teleports to you and stuns for 4s, and common map patterns also drain Chrono Gauge.
tips:
- Play with sound on and Step to the rhythm of Holographic Afterimage.
- For sweeping or rotating lasers, stand mid-map and Step toward the laser coming at you.
- Dragon Thunder can be dodged by standing on a warning and Stepping in place, or Stepping into it as it fires.
- During Great Whirlwind, Step near the blue safe zones to earn refunds for the later hits.
- Standing on top of him avoids the Phase 2 Recall Strike hologram and trailing sword waves.
- A full 10,000 Fever run gives roughly 1.5x the usual number of bursts, so time bursts around the groggy.
notes:
- Not in the boss catalog. The MapleSEA season ended at the 30 Sep 2026 maintenance; kept for reference in case Kai returns.
