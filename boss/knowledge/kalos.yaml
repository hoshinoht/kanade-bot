boss: Kalos
summary: Gatekeeper Kalos (also called Kalos the Guardian or Watcher Kalos) is a system-control fight. T-Boy keeps switching on four tower weapons and the party must shoot them off with Will of Kalos; if all four stay on, the run fails. Phase 2 adds a safe-dome test after every 25% of HP.
core:
- 'Four weapons, each with a dot on the gauge: Eye of Restraint (left tower, stun laser; also called Eye of Penitence), Eye of the Abyss (right tower, darkness arrows), Bombardment Fighter (top drone, downward beam; also called Beam Strafe Maneuver) and the Odium sphere (bouncing ball).'
- One weapon switches on every 80 s (Easy), 70 s (Normal) or 60 s (Chaos/Extreme), and every Watcher's Roar (also called Guardian's Roar or FMA, the full-map attack) switches on one more.
- Press the NPC/Gather key to aim Will of Kalos (also called Kalos's Will) and press again to fire. It refills about every 10 s (the wiki says 15 s on Easy), auto-fires after 10 s and does not charge while you are dead; since SEA v251 its crosshair stays fixed. Shoot the Eyes directly; for the drone and the ball, shoot the generator above or below them as they pass.
- Hits needed scale with party size. Eyes take 2 per member on Easy and Normal (3 on Chaos and Extreme); the drone takes 1 on Easy and Normal (2 on Chaos and Extreme); the ball takes 1 on Easy and 2 on Chaos and Extreme (Normal unconfirmed).
- If all four weapons are still active when the next activation timer ends, the party is ejected. Freeing any one resets it.
- Phase 2 HP is split into four 25% segments. Each segment ends in a test of three safe domes; any death fails it and heals Kalos 5%, while success gives a 15 s groggy with all timers paused.
danger:
- Eye of Restraint's laser stuns and can chain into Kalos's attacks; it keeps firing during the dome test. Since SEA v251, freeing it cancels its current shot.
- On Chaos and Extreme, three or more active weapons empower all of them; empowered arrows can kill in two hits.
- Watcher's Roar (about every 2.5 min) is a one-shot that also adds a weapon; every bind delays it by the bind's length.
- Phase 2 Laser Breath kills through Heaven's Door and reaches one floor up; his dive lands on a random player.
- 'Below 25% HP (segment 2-4) a curse lands every minute: two stacks raise damage taken, a third kills a random player. Harvest the armguard to clear curses.'
tips:
- Assign a caller to watch Kalos after every teleport and one player to run timers (Roar, breath, dive, next system).
- Call generator numbers 1-5 for drone and ball shots so two people never spend shots on the same one.
- Fire at the ball when it is about halfway to its generator; the barrier lasts only about 2 s.
- Read a weapon's colour to count the shots left (red, then purple, then dark blue).
- Use Hero's Will before the left tower's laser lands to avoid its stun.
- 'Authentic Symbol: Hotel Arcs Lv 11 adds +20% damage against Kalos (SEA v251).'
