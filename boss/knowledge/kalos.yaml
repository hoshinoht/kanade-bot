strategies:
- name: Clear left first
  when: Easy and Normal, learning parties or low shot accuracy
  risk: low
  damage: low
  payoff: Fewest stun-chain deaths and safe dome tests
  steps:
  - Cleanse Eye of Restraint first, then Eye of the Abyss, then the ball, then the drone (the least dangerous).
  - Shoot the towers from close range so the shot cannot miss.
  - Never start a dome test while the Left tower is active.
  - Hold a charged shot when the next system is about 10 s away, instead of firing at nothing.
- name: Prepare weapons
  when: Chaos and Extreme, where three active weapons empower all of them
  risk: medium
  damage: high
  payoff: Keeps the active count under three at tests and bursts
  steps:
  - Shoot one weapon (often the ball or drone) down to its last colour and leave it there as a reserve.
  - When a third weapon switches on, finish the reserve to drop back to two.
  - Leave a nearly finished weapon up until the next activation, so you do not re-roll a worse one.
  - Prioritise the Right tower over Left when arrows are empowered, and keep shooting during tests and bursts.
- name: Hold HP, then burst
  when: Any difficulty; the main party damage plan
  risk: medium
  damage: high
  payoff: One long burst per segment and fewer weapon cycles
  steps:
  - Phase 1 - group on one side, wait for his first teleport so everyone has loaded, then bind and burst.
  - Phase 2 start - group in the middle so his opening dive lands there, step out, then bind and burst.
  - Stop about 0.3-1% above each 25% threshold and phase once Left is off and fewer than three weapons are up, before the next Roar adds a weapon.
  - Burst again in the 15 s groggy after each dome test, and burst through segment 2-4 quickly.
