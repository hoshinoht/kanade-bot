strategies:
- name: Midnight burst (party)
  when: Parties of 2-6, especially Normal and Hard with mixed damage
  risk: low
  damage: medium
  payoff: Safest burst window; protects the Midnight segment
  steps:
  - Burst immediately in Phase 1 to get out of the pillar phase.
  - In Phase 2, hold binds and main burst for Midnight and start just before the Mithra's Power check resolves.
  - Push as much HP as possible before Dawn, because leftover Dawn shield is healed back at Noon.
  - Everyone plays to avoid curses in Noon, Sunset and Dawn; clean segments regrow Midnight.
- name: Kill before Dawn
  when: Strong solo or duo that can take most remaining HP in one cycle
  risk: medium
  damage: high
  payoff: Skips Dawn's shield and deer entirely
  steps:
  - Go into Phase 2 Midnight with every burst and bind and aim to finish her there.
  - If she will clearly survive, save Genesis i-frames or Ascent skills to survive Dawn instead.
- name: Solo rhythm play
  when: Solo Normal or Hard
  risk: medium
  damage: medium
  payoff: Very few gauge stuns while keeping DPS up
  steps:
  - Learn how many attacks fit between her stab and rush and crouch on cue.
  - Phase 1 - stand between two pillar spawn points and stay near Seren so she throws fewer sword auras; jump over the slow one.
  - Noon - play the left side; the far right has an off-screen hazard and the middle catches crossing lasers.
  - Dawn - fight on one side away from orb spawns, kite the deer across, wait for her trap cast, then pass through her and clear orbs; aim to let her heal no more than about 5-10%.
