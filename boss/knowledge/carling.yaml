strategies:
- name: Balanced gauges
  when: Parties, first clears, or any spec with room to spare
  risk: low
  damage: high
  payoff: Keeps most Mental Strength so mistakes are survivable; walking gauges costs uptime, so the clear is slower
  steps:
  - Keep every gauge between 1 and 999 (250-750 on Extreme) in all phases.
  - 'Phase 1 order used by min-cut solo players: Hondon, Do''oul, Gunggi. Burst Hondon after its second frenzy, then take a few Hondon hits to pre-drain Do''oul before leaving.'
  - In Phase 2, bait Carling's teleport to the third whose laser colour you need.
  - 'Phase 3 order: Do''oul, Gunggi, then Hondon last, so you can stand centre with Carling and push her HP before Aura Overflow starts; walk between zones to fix gauges.'
  - Before the Phase 3 Perils spawn, wait on Do'oul's side to pre-load its gauge.
- name: Do'oul turbo (break build)
  when: Solo or duo near the minimum cut, only after a clean Phase 1 (all blessings plus the refill) and a Phase 2 with no spirit or Scroll hits
  risk: high
  damage: low
  payoff: Near-full Phase 3 uptime with only one gauge left to manage
  steps:
  - At Phase 3 start, park in the right (Do'oul) zone and burst, letting Do'oul reach 1000 and Gunggi reach 0 (700 Mental Strength spent).
  - After Do'oul dies, manage only Hondon's gauge by alternating between the Hondon and Gunggi zones, using each zone's statue.
  - With about 300 Mental Strength left, one or two deaths end the run; play safe through Aura Overflow.
  - The older Hondon-zone build (hit everything from Hondon's zone) stopped working after MapleSEA v251's zone rule.
