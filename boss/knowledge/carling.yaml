boss: Carling
summary: Carling (also called Kaling) replaces deaths with a shared 1000 Mental Strength pool and three linked Balance of Season gauges for Gunggi, Do'oul and Hondon; a gauge reaching 0 or 1000 locks and costs 350, so runs are won by gauge control more than raw damage.
core:
- 'Mental Strength (also called Willpower) is shared: 1000 at the start, and the run fails at 0. Each death costs 160/100/80/70/60/50 for parties of 1-6 (MapleSEA v249). Phase 2 spirits (-30) and the Scroll trap (about -50) also drain it. The only refill is +300 for finishing Phase 1 with no gauge broken.'
- 'The Balance of Season gauges (also called seasonal gauges) start at 500 and are linked: a Gunggi (Spring, also called Goongi) hit raises Gunggi and lowers Hondon; Do''oul (Summer, also called Dool) raises Do''oul and lowers Gunggi; Hondon (Autumn, also called Chaos) raises Hondon and lowers Do''oul. A gauge at 0 or 1000 locks and costs 350; three breaks end the run.'
- 'The Four Gentlemen laser flowers (also called Four Gracious Plants) move gauges by colour: red = Gunggi, green = Do''oul, yellow = Hondon.'
- 'Phase 1 splits the party into three Peril rooms (max 2 each). While alive, Gunggi drains Mental Strength every 30s, Do''oul shields the other two every 45s, and Hondon makes the others hit 25% harder. Killing a Peril with its gauge unbroken grants its blessing: Gunggi blocks one lethal hit, Do''oul gives a Purification cleanse for Phase 2, Hondon gives +10% final damage.'
- 'Do''oul takes 50% less damage unless you light three Tesla coils in a triangle and lure it into the current; clear electric puddles with the mini coils (Harvest key) before Do''oul absorbs them as a shield.'
- 'Phase 2 Carling uses all three Perils'' attacks. After her flight she teleports; bait it toward the third of the map whose laser colour you need (left Gunggi, centre Do''oul, right Hondon). Purification (Harvest key) clears Confusion and fits the Vengeful Spirits wave each minute.'
- 'Phase 3: Gunggi (left), Hondon (centre) and Do''oul (right) have fixed zones. Only the Peril in your zone takes damage (Ascent skills excepted; MapleSEA v251), and standing in a zone pushes its gauge every 6s. Outside Carling''s zone you take +80% damage and cannot use potions. Each Peril kill unlocks the next 25% of Carling''s HP.'
danger:
- After all three Phase 3 Perils die, Aura Overflow kills everyone in Carling's zone every 30s (plus one random zone on Hard/Extreme), ignoring most invincibility; plan the last kill and leave the flagged zone. MapleSEA's name for it is unconfirmed.
- Phase 2 Vengeful Spirits (each minute) and the Scroll imprisonment cost Mental Strength directly; a Scroll catch often chains into a spirit hit.
- Do'oul's Phase 3 lightning stuns long enough for a second bolt; outside Carling's zone the follow-up can kill outright.
- Gunggi's hide-and-seek wipes the room if nobody hits the right Torn Spring painting within 15s.
- Repeatedly taking one Peril's attacks maxes its gauge and bottoms out its neighbour at the same time.
tips:
- Name one gauge caller who calls numbers; before leaving a room, pre-load the gauge the next room will push down.
- Never break a gauge in Phase 1; losing the blessings and the +300 refill usually means restarting.
- In Phase 3, switch on the zone statue (Harvest key) before single-target bursts so they hit the Peril, not Carling.
- In Phase 2, burst right after Carling's flight and dodge spirits by staying airborne or high up.
- A full party pays less per death but shares one pool, so it has fewer total spare deaths than it looks.
difficulty_notes:
  h: On Hard and Extreme, Aura Overflow hits Carling's zone plus a random second zone, and Gunggi's Phase 3 tornado order is random (fixed on Easy/Normal).
  x: Extreme adds +30% damage taken from a Peril's element whenever its gauge is outside 250-750, and Do'oul's Phase 1 shields double to 2% HP.
notes:
- HP rows are KMS values before OVERDRIVE (what MapleSEA has now, including the v244 and v251 cuts). Phase 1 and 3-1 rows are per Peril (three each); 3-2 is Carling; Phase 3 rows are rounded.
- 30 minute limit before OVERDRIVE. Bindable since MapleSEA v244. MapleSEA caps boss clears at 12 per week (v249).
