strategies:
- name: Balanced gauges
  when: Parties, first clears and practice runs, or any spec with room to spare
  risk: low
  damage: high
  payoff: Keeps most Mental Strength, so deaths and mistakes are survivable. It is the hardest route to execute (three linked gauges all fight) and walking zones to fix them costs uptime, so it needs the most damage.
  steps:
  - Keep every gauge between 1 and 999 all fight; on Extreme stay around 250-750.
  - 'Phase 1 order: 2026 guides default to Tiger, Bird, Dog. Higher-spec players and most Destiny clears use Dog, Tiger, Bird: burst Dog after its second frenzy, then take a few Dog hits to pre-drain Tiger before leaving.'
  - In Phase 2, bait Carling's teleport to the third whose laser colour you need.
  - 'Phase 3: Tiger first (its lightning is the most dangerous), then Bird, and Dog last so you can stand centre with Carling and push her HP before Aura Overflow; walk between zones to fix gauges.'
  - Before the Phase 3 Perils spawn, wait on Tiger's side to pre-load its gauge.
- name: Tiger + Bird break (Do'oul turbo)
  when: Destiny Carling and solos near the minimum cut, after a clean Phase 1 (all blessings plus the refill) and a Phase 2 with no spirit or Scroll hits
  risk: high
  damage: low
  payoff: The setup at the start of Phase 3 is the hard part; afterwards only Dog's gauge matters, so you walk less and keep near-full uptime on Carling. The lowest damage requirement, paid for with 700 Mental Strength.
  steps:
  - At Phase 3 start, stand in Tiger's zone (right) and burst so Tiger reaches 1000 and Bird reaches 0 (two breaks, 700 Mental Strength).
  - Stop repairing Tiger and Bird. Keep Dog in range by alternating between the Dog and Bird zones, using each zone's statue.
  - 'Kill orders seen in 2026: Tiger, Bird, Dog (a 2026 Destiny clear) or Bird, Dog, Tiger; jobs differ. What matters is that Dog is the only gauge left.'
  - With about 300 Mental Strength left, one or two deaths end the run; play safe through Aura Overflow.
  - 'Extreme: no 2026 break-build clear was found, and Extreme adds +30% damage from any Peril outside 250-750, so treat it as unproven there.'
- name: Bird + Dog break
  when: Alternative to Tiger + Bird for jobs that handle Tiger's zone better; Korean guides say to pick the Peril you find hardest and kill it first
  risk: high
  damage: low
  payoff: Same trade as Tiger + Bird (two breaks, 700 Mental Strength) but leaves Tiger as the only gauge to manage.
  steps:
  - Break Bird and Dog at the start of Phase 3 and keep only Tiger in range.
  - 'Kill orders in 2026 Korean guides: Tiger, Dog, Bird or Bird, Dog, Tiger.'
