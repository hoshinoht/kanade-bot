strategies:
- name: Phase 1 room assignment
  when: Every party, set before entering.
  risk: low
  damage: low
  payoff: Each player starts in the room that suits them.
  steps:
  - First to join goes to Baldrix, second to Sleipnir, third to the Ancient God; leave and rejoin to change the order. In a trio keep one player per room so every gauge drains.
  - The Baldrix room needs steady uptime inside his Zone and on the weak-point side (the guide rates it hardest; KMS players rate Sleipnir hardest).
  - The Sleipnir room wants a stun answer such as Hero's Will for chain stun-locks.
  - The Ancient God room player keeps closing rifts and steers the mirror light onto the possessed statue.
- name: Clean Phase 2
  when: Parties that can dodge Phase 2 without overflowing; the guide encourages it.
  risk: medium
  damage: medium
  payoff: A one-time shield that blocks the first Ragnarok's +300 in Phase 3.
  steps:
  - Never let your personal gauge reach 1000 in Phase 2; each overflow adds a permanent Magic Mark.
  - Crouch Magic Storm and warn the next side; the storm's portal shows where it goes next.
  - Face and take purple attacks rather than dodging them.
