boss: Baldrix
summary: Magic Erosion is permanent and 1000 ends the run, so keep room gauges low through the forced rotations of Phases 1-2, avoid Magic Marks, and burn off Squeezing Magic with afterimages in Phase 3.
core:
- Magic Erosion (also called Encroachment) is shared, starts at 0, never goes down, and fails the run at 1000. A death adds 200 solo, 100 in a duo, or 70 in a trio.
- 'Phase 1: party join order (not the leader) sends players to Baldrix, his steed Sleipnir (also called the Minion), or the Ancient God. Each room has a 0-1000 gauge that drains 12/10 per second while occupied, fills 8 per second while empty, and rises when you are hit. Solo and duo players get a portal (NPC/Gather key, 10s cooldown) to an empty room.'
- 'Every 120s in Phases 1-2 the party is moved by force and room gauges convert into Erosion: 20 at 250, 50 at 500, 70 at 750, 90 at 1000 per room.'
- 'Phase 2 splits players across the Centre, East and West sides, and Baldrix cannot be bound. Your personal gauge decays 5/4 per second; reaching 1000 adds an Overflow stack and a permanent Magic Mark. In a trio, 3/6/8/10/12 Overflow converts to 50/100/150/200/250 Erosion at each swap, and Marks at 6/11/14 copy extra patterns between sides (the last tier also strengthens his Phase 3 Zone).'
- 'Phase 3 is fought together: personal Squeezing Magic rises 6/7 per second. From 300 his direct attacks leave purple afterimages, and taking an afterimage lowers the gauge. At 1000 it drops to 600 and starts Soul Execution.'
- Ragnarok, every two minutes in Phase 3, deals no damage but adds 300 Squeezing Magic to everyone while he is invulnerable for about 5s. HP is split roughly 26/28/46% across the phases.
danger:
- 'Above 750 a room''s penalty spreads to every room until it falls back; at 1000 it worsens and sticks until the rotation. Baldrix: hitting him away from the weak point costs 25/30% final damage. Sleipnir: corrupted zones deal 10% HP per second. Ancient God: 15/20% of the damage you take is shared onto allies.'
- Soul Execution makes his direct attacks deal 100% HP until afterimages bring your gauge to 0 (or you die), and standing outside his Zone costs 100% HP per tick; reaching 1000 again while in it kills you through i-frames and revive skills.
- The Ancient God room gains 250 if the mirror light fails to hit the possessed statue twice in six shots. It gains 500, and all rifts reset, once 4 rifts on Normal or 3 on Hard are fully open; a rift spawns every 10s and, left alone, the first is fully open after about 40s.
- Phase 2 Magic Storm passes through all three sides in turn (crouch it), and purple attacks must be faced and taken rather than dodged.
- Sleipnir's chains can stun-lock you; keep Hero's Will or a stun cleanse ready.
tips:
- Call room gauges and leftover bind resistance before each rotation, and stop trading gauge for damage near the 250/500/750 thresholds.
- Fight Baldrix inside his Zone and from the side his weak point shows; he cannot be damaged for about 5s after entry, and a Heavy Rainfall hit hides the weak point for a few seconds.
- Close Ancient God rifts early, mostly while a statue is possessed; they cost 1, 2 and then 3 attack stacks as they widen, stacks cap at 3, and you can close rifts mid-air.
- In Phase 3, take afterimages on purpose to keep Squeezing Magic low, especially just before Ragnarok; call which afterimage you will take (the triple swing's removes the most).
- In Phase 3 he does not use Triple Swing, Triad Thunder or Zone in the 10-20s before Ragnarok. Stay near his centre and call Zone explosions and slowing flowers.
- Under Soul Execution, meet any hit with damage reduction, a shield or i-frames, and never leave the Zone.
strategies:
- name: Phase 1 room assignment
  when: Every party, set before entering.
  risk: low
  damage: low
  payoff: Each player starts in the room that suits them.
  steps:
  - First to join goes to Baldrix, second to Sleipnir, third to the Ancient God; leave and rejoin to change the order. In a trio keep one player per room so every gauge drains.
  - The Baldrix room needs steady uptime inside his Zone and on the weak-point side (the guide rates it hardest; KMS players rate Sleipnir hardest).
  - The Sleipnir room wants a stun answer such as Hero's Will for chain stun-locks.
  - The Ancient God room player keeps closing rifts and steers the mirror light onto the possessed statue.
- name: Clean Phase 2
  when: Parties that can dodge Phase 2 without overflowing; the guide encourages it.
  risk: medium
  damage: medium
  payoff: A one-time shield that blocks the first Ragnarok's +300 in Phase 3.
  steps:
  - Never let your personal gauge reach 1000 in Phase 2; each overflow adds a permanent Magic Mark.
  - Crouch Magic Storm and warn the next side; the storm's portal shows where it goes next.
  - Face and take purple attacks rather than dodging them.
notes:
- 30-minute limit in MapleSEA now (20 minutes after OVERDRIVE) and 10-second potion cooldown. Phases 1-2 keep players in separate rooms, so party buffs do not reach each other until Phase 3.
- The Talahart Authentic Symbol at Growth Level 11 gives +20% damage against him (MapleSEA v251). MapleSEA names for the Phase 2-3 mechanics, the portal and the shield are unconfirmed.
- 'Destiny Weapon: each clear gives Adversary''s Resolve, split among everyone who entered: Normal 150, Hard 450.'
