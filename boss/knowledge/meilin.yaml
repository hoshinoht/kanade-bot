  notes:
  - Cards and Storm failures are lethal (1000% max HP) on Hard only; Hard also adds rings, arrows and sword swings and speeds up the Flame and Freeze swings.
strategies:
- name: Full-mechanic route
  when: Standard approach at or near the recommended spec; first clears
  risk: medium
  damage: medium
  payoff: About one extra borrowed burst per minute plus an Order skill roughly every three minutes
  steps:
  - Stay glued to Meilin and clear every Destiny pattern so the gauge fills about once per pattern cycle.
  - Take the altar pick at once, choosing picks that complete the three class icons for an Order.
  - Fire each held Chaos skill in a burst or semi-burst before the next full gauge, so the altar does not overwrite it.
- name: Invincibility skip for Phase 2 swords and storm
  when: Classes with Genesis liberation invincibility, Ascent, or short i-frames (e.g. Shadower, Mihile)
  risk: low
  damage: medium
  payoff: Fewer deaths and missed gauge on the two hardest Destiny patterns, with free damage during them
  steps:
  - Swallowing Storm, stand inside the golden barrier and use Ascent or a short i-frame through the shove instead of riding the wind.
  - Soul Swords, start Genesis invincibility around the second sword and cover the last sword with Ascent; on Normal a long invincibility can cover the whole pattern.
  - Do not use invincibility on Flame and Freeze; an invincible clear there gives no gauge.
- name: Damage check, ignore the gimmick
  when: Well above the recommended spec
  risk: low
  damage: high
  payoff: Simplest run; Chaos and Order are only bonus damage, not a clear requirement
  steps:
  - Dodge Destiny patterns safely rather than chasing gauge, and use Chaos or Order only when they come up.
- name: Minimum-spec reroll
  when: Below the recommended spec, aiming for Hard at the lowest possible stats
  risk: high
  damage: low
  payoff: Hard clear under spec, but it needs many retries because Order rolls are random
  steps:
  - Clear every Destiny pattern so no gauge is lost, and spend every burst and semi-burst on cooldown (one guide counts 11 windows).
  - Restart runs with poor Order rolls; one guide ranks reset-5th, then +20% final damage, then the bind, though the best roll depends on class.
  - Hide heavy skill and Soul effects so the diagonal explosions and gauge stay readable.
