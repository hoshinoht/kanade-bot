boss: Meilin
event:
  name: Challengers World Season 4
  availability: 'KMS Challengers World Season 4 ran 18 Jun – 17 Sep 2026. Expected in MapleSEA around Nov 2026 (not yet announced); MapleSEA names may differ.'
  aliases: [Maerin, 메이린]
summary: 'Meilin (also called Maerin), Guide of Destiny, is a solo fortune-teller fight: clear her Destiny patterns to fill Remnants of Destiny, borrow another class''s burst skill (Chaos) at the altar, and match three class icons to earn a powerful Tab skill (Order).'
core:
- Challengers World characters only. Solo, 20-minute limit, 5 lives, 10s potion cooldown, 380% PDR. One HP bar; at 50% she becomes immune, strips all debuffs and binds, and transforms into Phase 2. One clear per Maple ID per week, shared by Normal and Hard (KMS reset Thursday 00:00), not counted in the weekly boss limit.
- Remnants of Destiny gauge (0 to 1,000) fills slowly over time and by a large amount for each Destiny pattern you clear. Her hits and failed Destiny patterns drain it; on Hard the diagonal map explosions drain it too. Hard gives far less gauge per cleared pattern than Normal.
- A full gauge spawns the Altar of Destiny mid-map; interact quickly or the gauge resets. Pick one of three random other-class burst skills (Chaos) and fire it once with the NPC/Gather key. Taking a new one deletes the one you hold, even mid-effect.
- 'Three class icons sit by the gauge. Pick Chaos skills from all three classes to get one random Order skill on Tab: +1 Ascent use, reset Origin cooldown, reset all 5th-job-and-below cooldowns, +20% final damage for 15s, or an extra 10s bind that ignores bind resistance.'
- Every 55s she casts a Destiny pattern. She is defenceless but immune to binds during it, so clear the mechanic first and use the window for normal damage. Phase 1 has four (Area of Rest, Flame and Freeze swords, Arrows, Cards); Phase 2 adds Swallowing Storm and Soul Swords.
- Fight glued to her. Most body-pattern blind spots are on her, and if you get about 700px away or jump about 300px high she teleports onto you and blasts the spot.
danger:
- 'Cards of Truth and Lies: 7 face-down cards shuffle 4 times on Normal, 6 on Hard. Every card except the true one becomes a floor-to-ceiling blade: 80% max HP on Normal, 1000% (death) on Hard.'
- 'Swallowing Storm (Phase 2): a gust shoves you sideways about 3s after the warning, then blades cover the map. Only the golden barrier is safe; outside it is 80%/1000% (death on Hard). The ceiling laser shows the wind direction; a purple swirl on it means a strong push.'
- Soul Swords (Phase 2) is widely called her worst pattern. Three swords flash 3 times on Normal, 5 on Hard, then slam in that order. The sweeps reach past the neighbouring sword and also hit behind, so wall-hugging fails. Any hit fails the pattern.
- 'Phase 2 Hand of Fate: after the two hand pushes, a circle tracks you above or below for about 3s, then a hand stabs from it for 50%/55% plus a stun (from above) or launch (from below). Sources rate it the trickiest body pattern.'
- 'Teleport: if you stray too far or jump too high she blinks to your x-position and releases a blast (25%/30%; Phase 2 fires twice at 40%/50%). The blink itself does no damage, so move off the spot at once.'
- 'Wave attack: an eye icon above her decides it. Open eye, face her; closed eye, face away. Getting it wrong costs 30%/40% and a stun. In Phase 2 it fires twice, always one open and one closed.'
tips:
- Stay on top of her. Shadow Sword Aquila's blades, the charge and the hand pushes are all easier to avoid point-blank. Jump the charge when the dark-blue half is on top, crouch when it is below.
- Area of Rest needs no movement skills; teleports skip the rings and earn nothing. Walk on the top platform and touch each blue section as the ring closes (3 rings on Normal, 5 on Hard).
- For Flame and Freeze, ignore which sword she swings and stand in the slanted zone matching the icon over your head until its count hits 0. Standing at the pillar left of her and jumping in place is a known shortcut.
- For Arrows of Destiny, drag each arrow so it passes through a purple spirit. Firing points sweep from one side to the other (and back on Hard), so pulling arrows through the middle near her hits the spirits reliably.
- 'Best Chaos picks: Evan Zodiac Ray (strongest) and Hoyoung Mountain Spirit Summon (30s summon), then buff skills such as Angelic Buster Spotlight or Phantom Joker. Avoid Night Lord Spread Throw, which forces you into melee range. Since 23 Jul 2026, Chaos skills no longer trigger your own additional-hit skills.'
- Most players save Order for a 2-minute or Origin burst. Stack the bind Order with your existing binds; reset-Origin also resets her Origin bind resistance. Reset-5th lets you run a second normal burst at once, but her bind resistance is not reset. +1 Ascent is the weakest roll.
notes:
- Not in the boss catalog; it is a KMS seasonal boss that MapleSEA has not released. Pattern names follow Orange Mushroom's KMS translations (which spell her Maerin) and may differ in MapleSEA.
- All values are KMS values. She launched alongside KMS OVERDRIVE, so there are no separate pre-OVERDRIVE numbers; the 20-minute limit is her own.
- A clear only counts after you also defeat the Forbidden Sacred Object in the reward map, which takes fixed damage per hit.
