- name: Destiny
  entry_level: 285
  boss_level: 285
  party_max: 1
  mission:
    series: destiny-weapon
    order: 5
    title: Battle, Limbo
    modifier: {text: Starts at 800 Erosion, direction: down}
    needs: 12,500 Adversary's Resolve
    rules: [Practice Mode clears count, No Cross World]
  notes:
  - title: 200 Erosion of room
    text: Hard, solo. One death (+150) nearly ends it; avoid every hit and the grab.
    detail: 'Destiny Weapon 2nd Growth mission "Battle, Limbo" (MapleSEA v252): Hard Limbo solo in Destiny Mode, starting at 800 Erosion instead of 0. Fifth mission; needs 12,500 Adversary''s Resolve. With only 200 Erosion of room, one death (+150) leaves almost nothing; avoid every 50/80-Erosion hit and Limbo Black''s grab. Practice Mode clears count (MapleSEA v249); not available in Cross World boss content. OVERDRIVE''s phase-specific practice will not count.'
  - title: 800 is only the start
    text: 'The Passageway (-150) and Phase 3 recovery can take you below 800; record Erosion at each phase.'
    detail: '800 is a starting value, not a floor: the Passageway after Specter C (-150) and recovery in Phase 3 can bring Erosion below it, so complete them and note your Erosion at each phase entry. The second-fusion skip is described for Normal; do not plan the Hard mission around it.'
  - title: Never let Risk reach 100%
    text: Bring enough damage that the Phase 2 special pattern never runs.
    detail: 'Community advice: bring enough damage that the Phase 2 special pattern (Risk at 100%) never runs.'
strategies:
- name: Skip the second fusion
  when: Parties with comfortable damage for Phase 2. Described for Normal; unverified on Hard.
  risk: low
  damage: high
  payoff: Removes the second disappearance and fusion pattern
  steps:
  - At exactly 80% of Phase 2 HP Specter C disappears for about 5s; hold damage until he is back.
  - Damage him during the attackable parts of the ~30s fusion and get below 70% before it ends.
  - The next fusion triggers 20 points below the HP reached during the first (75% gives 55%), so under 70% it never comes.
  - Risk is paused and Purification is off during the fusion; dodge, then purify as soon as it is back.
- name: Handle both fusions
  when: Parties near minimum damage
  risk: low
  damage: medium
  payoff: Slower Phase 2, but no burst is spent while he is gone
  steps:
  - Do not burst into either ~5s disappearance; keep hitting in the attackable parts of each fusion.
  - Judge where the next fusion triggers from the current HP (20 points below what you reached) instead of holding everything until the second fusion ends.
