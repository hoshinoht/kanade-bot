boss: Limbo
summary: 'Purification is the fight''s currency: avoid chip hits so it charges, press it the moment it fills to clear Risk and each phase''s hazards, and keep your personal Erosion under 1000.'
core:
- Erosion is personal, starts at 0 and removes you at 1000; a death adds 150.
- Purification Energy (NPC/Gather key; also called Spirit Purification) charges over time, and getting hit resets the charge. Besides lowering Risk, each use has a room-specific effect such as restoring floor or clearing pools and walls. Since MapleSEA v251 it can be used while casting Origin and Ascent skills.
- Phases 1 and 3 alternate between two forms every 100s (Specters A/B, then Limbo Black/White). Risk is personal in these phases; it starts full each rotation, each Purification removes 10%, and whatever is left turns into Erosion at the swap (30% left = +30).
- 'Phase 2 (Specter C, then Specter D): Risk is shared by the party, starts at 0 and climbs 4% per second. Each press removes less in bigger parties: Specter C 39/19.5/13% on Normal or 50/25/16.7% on Hard for solo/duo/trio, Specter D about half that. At 100% a special pattern runs and the boss cannot be damaged.'
- Between Specters C and D, the Passageway gives 30s to bounce spikes into the Shadow of Origin three times; success removes 150 Erosion and failing costs nothing.
- HP is split 30/30/40 across the phases; Limbo cannot be slowed but can be bound.
danger:
- Specter B knocks out a floor section every 30s and falling through adds 50 Erosion; Purification restores floor. Its bouncing slime can land five hits in a row and resets your Purification charge.
- 'Specter D walls off the map at 25/50/75/100% Risk (left, right, bottom, top); being inside a section as it closes deals 300% HP, and 100% starts the Endless Abyss test, the most dangerous pattern in the fight.'
- 'Limbo Black: a pink contamination pool appears every 7s and six at once trigger a special pattern; purify next to a pool to remove it. His grab adds Erosion and leaves you open to follow-ups.'
- 'Limbo White: six Walls of Thought trigger a special pattern, and Monster of Truth ticks every 0.2s; on Hard with the sphere debuff it can add hundreds of Erosion per second.'
- Specter C fuses with its Flowers at exactly 80% of Phase 2 HP and again 20% of HP after the first fusion ends, invulnerable for about 30s each time.
- Leaving the bubble around Specter A or Limbo Black makes Erosion tick up every second. On Hard, most 50-Erosion hits become 80 and Limbo Black's grab adds 100.
tips:
- Press Purification the moment it is full, in every phase; dodging is how you keep it charging. In Phases 1 and 3, ten presses per 100s rotation clear your personal Risk.
- In Phase 2 every member presses on full, since one idle player can let shared Risk reach 100%. Against Specter D the climb outpaces even a full party, so pull Risk back under each wall threshold before it closes.
- Fight Specter A and Limbo Black inside the bubble; crouch Grasp of Truth and stand on top of him for Dimensional Collapse.
- Unbound Limbo Black usually grabs after about four other attacks; after a fifth, expect the grab next. Stand behind or above him when the purple line shows.
- Against Specter B, burst with a Genesis i-frame up or after the slime has passed.
- Risk Taker is usable here except against Specter D and Limbo Black.
notes:
- 30-minute limit, 10-second potion cooldown, 1-3 players.
- MapleSEA v251 (Jun 2026) made Purification Energy usable during Origin and Ascent casts and made the Phase 3 map (Limbo's Unconscious) about 32% taller.
- Carcion symbol at Growth Level 11 gives +20% damage against Limbo (MapleSEA v251). MapleSEA v249 also caps boss kills at 12 per week.
