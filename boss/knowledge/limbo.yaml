- name: Normal
  entry_level: 285
  boss_level: 285
  pdr_percent: 380
  party_max: 3
  force: {kind: sacred, value: 500}
  hp:
  - {phase: '1', value: 1.945q}
  - {phase: 2-1, value: 972.5t}
  - {phase: 2-2, value: 972.5t}
  - {phase: '3', value: 2.625q}
  notes:
  - title: Aim for 550 Force
    text: The full 1.25x damage tier; unconfirmed for SEA.
    detail: 500 Authentic Force to enter; 550 (the full 1.25x damage tier) is strongly recommended. MapleSEA notes do not state the 550 tier, so that part is unconfirmed for SEA.
  - title: After OVERDRIVE
    text: HP ≈ 1.31q / 656t / 656t / 1.77q (-32.5%), 20 min. SEA due Oct-Nov 2026.
    detail: 'After OVERDRIVE (KMS Jul 2026, due in MapleSEA Oct-Nov 2026): HP about 1.31q / 656t / 656t / 1.77q (32.5% less), 20-minute limit.'
