strategies:
- name: Skip the second Specter C fusion
  when: Parties with comfortable damage for Phase 2
  risk: low
  damage: high
  payoff: Avoids a second invulnerable fusion of about 30s
  steps:
  - Hold burst until the first fusion at exactly 80% of Phase 2 HP finishes.
  - Burst immediately after; pushing to about 70% by the time the next fusion would trigger usually prevents it (Korean community tip).
- name: Play through both fusions
  when: Parties near minimum damage
  risk: low
  damage: medium
  payoff: Slower Phase 2, but bursts are never wasted on an invulnerable Specter
  steps:
  - Watch the Phase 2 HP bar and save the next burst until the second fusion has finished.
