  - {phase: 2-2, value: 1.89q}
  - {phase: '3', value: 4.993q}
  notes:
  - title: Aim for 550 Force
    text: The full 1.25x damage tier; unconfirmed for SEA.
    detail: 500 Authentic Force to enter; 550 (the full 1.25x damage tier) is strongly recommended. MapleSEA notes do not state the 550 tier, so that part is unconfirmed for SEA.
  - title: After OVERDRIVE
    text: HP ≈ 2.55q / 1.28q / 1.28q / 3.37q (-32.5%), 20 min. SEA due Oct-Nov 2026.
