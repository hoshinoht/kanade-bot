boss: FA
summary: 'The First Adversary is a parry fight: time Immortal Will on the right attacks to keep the party''s shared Power of Order high. That gauge sets everyone''s final damage and protects each player''s Will of the Adversary.'
core:
- Each player has 1000 Will of the Adversary (also called Enemy's Will); a death costs 200 and reaching 0 removes you.
- 'Power of Order is shared, starts each phase at 500 and decays 5 per second, but decay alone never drops it below the current stage (MapleSEA v247; one Korean source limits this to Normal and below, unconfirmed for Hard/Extreme). Stages: under 200 = -40% final damage, 200-399 = -20%, 400-599 = 0, 600-799 = +10%, 800+ = +20%.'
- 'Party scaling: a duo gains 50% and a trio 34% of the solo gauge amounts. Hits drain 75% (duo) or 50% (trio) of the solo loss on Easy to Hard, but the full amount on Extreme.'
- 'Cycle of Power every 2:18 (5s warning). At stage 4 or higher (600+) the gauge is kept (MapleSEA v249). Below 400 everyone also loses Will (100 at 200-399, 200 under 200) and the gauge returns to 500; whether a stage 3 gauge resets to 500 or is kept is unconfirmed.'
- Immortal Will (NPC/Gather key; also called Indomitable Will) is a 0.5s parry with a 6s cooldown. A rewarded parry cuts 4.5s off it and raises Power of Order, so a whiff costs the full 6s. It works while you are i-framed, but not during Origin or Ascent casts.
- 'Phase 1 (warrior/thief): parry the red strengthened hits; Shadow Partner copies swing before him. Phase 2 (mage/archer): each player gets Fire, Ice or Holy, re-rolled every Cycle, and only matching attacks are rewarding parries. Phase 3 mixes both, with strengthened hits glowing rainbow. HP splits 30/30/40; he can be bound (cancelling his pattern) but not critically bound.'
danger:
- On Easy/Normal only the hits you were meant to parry drain Power of Order; on Hard/Extreme every hit, map patterns included, drains it.
- 'Intense Strike (Phase 1): he hides between two clones and hits the whole map; the real body, whose daggers briefly glow red, deals 999%. With no parry ready, i-frame, take a clone hit at full HP, or crouch in a far corner.'
- Sword Shower (also called Greatsword Shower) ends with a slam dealing 1000% unless parried or cleared with a high enough jump; it is his opener when he is not bound on entry.
- Phase 2 Altar drops on a marked player and drains the gauge quickly on Hard/Extreme, so that player should take it to a corner early; moving it at the last moment makes others see it in the wrong place.
- Phase 3 Elemental Flow and Arrow Rain overlap with his other attacks; they are good slots for Genesis or class i-frames and Ascent skills, and a bind cancels Elemental Flow.
- Extreme adds much heavier hits, including a 999% final Sniping arrow and 200% last swings in Phase 3, and party gauge losses are no longer reduced.
tips:
- Reliable correct parries matter more than damage greed. Aim to enter every Cycle at 600+; once the gauge is high, dodge risky attacks instead of forcing parries.
- Call attributes clearly in Phases 2-3 and parry only your own colour.
- Stay on the same side as whoever holds aggro; he can turn around just before strengthened swings.
- Burst on cooldown rather than waiting for the Cycle, since waiting pushes every later burst back. The guide's ideal is 16 bursts (5 in Phase 1, 4 in Phase 2, 7 in Phase 3).
- 'Summon Evolve tell: both wings folded hits the centre, both spread hits both sides, one wing folded hits that side.'
- He casts nothing for about 5s before each Cycle, and big patterns stop 10-15s before it, so that is a safe damage window.
notes:
- MapleSEA v249 (Mar 2026) applied the KMS 1.2.407 change, so a gauge at stage 4 or higher keeps its value through the Cycle of Power.
- 30-minute limit, 10-second potion cooldown, 1-3 players. One clear per week shared across all difficulties; it counts on the Phase 3 kill.
- Odium symbol at Growth Level 11 gives +20% damage against this boss (MapleSEA v251). MapleSEA v249 also caps boss kills at 12 per week.
