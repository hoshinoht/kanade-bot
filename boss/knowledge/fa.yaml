strategies:
- name: Parry the opener
  when: Parties that parry reliably; most useful at minimum spec on Hard/Extreme
  risk: medium
  damage: low
  payoff: The first burst lands at stage 4 or higher, and that stage now survives the Cycle
  steps:
  - Do not bind on entry, so his first cast is Sword Shower.
  - Up-jump or i-frame the first slam, then everyone parries the second slam. In a trio one parry alone will not reach stage 4.
  - Burst right after the parry.
- name: Bind on entry
  when: Damage is comfortable, or someone cannot yet parry the opener reliably (inferred from the guide's wording, not stated as a recommendation)
  risk: low
  damage: high
  payoff: Immediate damage with no opener risk, but the first burst runs at stage 3 with no bonus
  steps:
  - Bind as you enter; the bind cancels his current pattern.
  - Burst during the bind and build the gauge with later red parries.
- name: Sniping, parry the final arrow
  when: Players confident in the timing; skip on Extreme unless practised, since the final arrow deals 999%
  risk: high
  damage: low
  payoff: Large gauge gain (+250 solo on Easy, +200 otherwise)
  steps:
  - During the six regular shots, steer the crossbow so it fires away from you.
  - Parry the final arrow of your own attribute.
- name: Sniping, avoid it
  when: Low on parry confidence, or the gauge is already high
  risk: low
  damage: medium
  payoff: No gauge gain and no risk
  steps:
  - Once the crossbow locks on, move onto the boss's centre and hold a blink or i-frame until the final arrow passes.
