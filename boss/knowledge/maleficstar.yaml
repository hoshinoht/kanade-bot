boss: MaleficStar
summary: Keep the party's Predation below 1000 by having the Awakener catch every Essence of Illusion, and pick a route that sets how much Illusion Magic you carry into Reality in exchange for up to +30% final damage.
core:
- Predation (also called Hunger in GMS) is shared, starts at 0 and fails the run at 1000; a normal 5-life count also applies. Every Essence caught removes 40 Predation. MapleSEA names for these mechanics are unconfirmed.
- One designated player, the Awakener (also called Awakened), is the only one who sees and catches Essences, picks altars and swaps rooms. Pick it at the preparation-room orb, otherwise it is the party leader; it only passes on if that player dies out, disconnects or leaves. The swap (NPC/Gather key) has a 30s cooldown and is locked while an Essence pattern or altar choice is up.
- 'Illusion room: Illusion Magic (also called Illusory Magic) starts at 1000 and each Essence caught removes 200. Final damage is fixed at 100%. Any hit on any player pushes the next Essence back (base 15s, capped at 35s).'
- 'Reality room: Essences come every 15s regardless of hits. Each catch opens two altars for 7s, picked by pressing the NPC/Gather key on the left or right half of the map: left lowers Illusion Magic by 250 for -5 to -15% final damage, right raises it by 250 for +5 to +15% (more at a higher gauge), within -10% to +30% overall.'
- 'Reality penalties scale with Illusion Magic: from 250 every hit adds Predation, from 500 the Floating Disaster joins (one source says 750), from 750 you take more damage.'
- Each room forces a swap after roughly 3:40. Phases are HP thresholds on one bar (Phase 2 at 80%, Phase 3 at 40%). Predation and gauge numbers here are solo values; a duo takes about half and a trio about a third (an Essence-pattern hit is 60/30/20 Predation for 1/2/3 players).
danger:
- A missed Essence adds 100/200 Illusion Magic in Illusion or 50/60 Predation in Reality (whether these also split by party size is unconfirmed), and Essence patterns add Predation and Illusion Magic when they connect.
- In the final minute of an Illusion stay Predation rises 2 per second. At 1000 Illusion Magic in Reality you cannot swap out, a 40s countdown starts and Predation rises 1 per second; the forced swap plays a roughly 5s cutscene and then costs 160/200 Predation.
- Swapping into Reality with any Illusion Magic left starts you at -10% final damage.
- Ready to Eat (Phase 3, Reality) sends one minion per player toward her; anyone can body-block them and every one must be stopped. If any arrive she follows up with a full-map blast whose only safe spot is the small triangle directly beneath her.
- Breath of Radiance (Phase 3) and Hard-only Sonata of the Nebula each spawn two Essences, and both must be caught to count. Dodge the pink lasers and stand inside the purple ones.
tips:
- 'Awakener: play a mobile class, stay near her so Essence patterns fire, check the minimap for edge spawns, and save i-frames for Essence and altar moments (each Essence lasts only about 1s). Bind the NPC/Gather key where you cannot hit it by accident; re-using the prep-room orb undoes a wrong pick.'
- Always swap by hand before a room's timer runs out rather than eating the forced swap.
- Dodge carefully in Illusion; every hit delays Essences for the whole party.
- Keep a Predation buffer large enough that one failed Ready to Eat does not end the run.
- Binding her before an Essence spawns delays it until the bind ends; her body attacks stop while bound but map patterns keep firing.
- 'Heavenly Waltz tell: both arms raised means spikes in front of her, one arm raised means spikes behind.'
strategies:
- name: Fully safe route
  when: Party damage well above the requirement; first clears.
  risk: low
  damage: high
  payoff: Slowest clear, almost no Predation gain.
  steps:
  - Stay in Illusion until Illusion Magic is empty or 1:00 remains on the room timer.
  - Enter Reality with the gauge at 0 to skip the -10% entry penalty.
  - Take the left altar on every Essence so Reality stays at its lowest penalty stage; only Essence-pattern hits then add Predation.
- name: Flexible standard route
  when: Most parties near or above the recommended spec.
  risk: medium
  damage: medium
  payoff: +30% for most bursts, with a way to back off.
  steps:
  - Empty Illusion Magic in Illusion, then enter Reality.
  - Take right three times (105%, then 115%, then 130% at gauge 750) without reaching 1000.
  - When Predation climbs faster than the party likes, switch to left altars until the timer ends or the party is ready to go right again.
  - Back in Illusion, stay until the gauge is empty or 1:00 remains.
- name: Hold +30% route
  when: Low-spec clears with sustained-damage classes and very clean dodging.
  risk: high
  damage: low
  payoff: Nearly the whole Reality stay at +30%.
  steps:
  - Burst twice in Illusion while emptying the gauge, leaving with about a minute on the timer.
  - Take three rights to reach 130%, then stop catching Essences, because every catch forces an altar choice.
  - Dodge everything; missed Essences and hits drive Predation up quickly.
  - Swap back near the timer's end; about five catches in Illusion recover roughly 200 Predation. Repeat.
- name: Burst-cycle route
  when: Low-spec Hard clears with burst classes; the guide rates it very hard and a caller helps.
  risk: high
  damage: low
  payoff: +30% on every burst.
  steps:
  - After the opening burst catch one Essence in Illusion and swap just before the second, so the -10% lasts only seconds.
  - With a high gauge each right is +15%; cycle right, right, left so 130% lands on each burst and the gauge never reaches 1000.
  - Do not bind her during a burst while an Essence or altar is still due; stall the 7s altar pick instead.
  - In Illusion catch two Essences without being hit, swap back just before the third, and arrive 30-40s before the next burst.
notes:
- 30-minute limit in MapleSEA now (20 minutes after OVERDRIVE) and 10-second potion cooldown; she cannot be slowed and resists Zero's critical bind.
- The area's Authentic Symbol at Growth Level 11 gives +20% damage against her (MapleSEA v251).
