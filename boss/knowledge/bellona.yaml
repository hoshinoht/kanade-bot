boss: Bellona
summary: 'Bellona is not in MapleSEA yet (KMS 1.2.418, Aug 2026); this is a prep guide. She is a dodge check: red attacks take a life, a shared gauge flips her into Insane mode where she takes +30% damage and hurts herself, and surviving an Insane window un-hit gives a life back.'
lead: 'A dodge check (KMS only so far): red attacks cost a life, and an Insane window survived un-hit gives one back.'
core:
- title: Red attacks cost a life
  text: 'Red hits take 1 Death Count and cut the gauge hard; purple hits cut it a little.'
  detail: 'Red (Annihilation) attacks remove 1 Death Count and cut the gauge sharply (200/400/600 on Easy/Normal/Hard, solo); purple attacks only cut it a little (80/80/160).'
- title: Shared gauge
  text: '0–1000, party-wide, moving about 31 per second: roughly 30s per state.'
  detail: 'The 0-1000 gauge is shared by the party and moves about 31 per second, so with no hits each state lasts roughly 30 seconds.'
- title: Insane mode
  text: 'Red attacks only; each one hurts her, and she takes +30% damage.'
  detail: 'In Insane the screen darkens, she only uses red attacks, damages herself with each one and takes 30% more final damage.'
- title: Clean Insane, +1 life
  text: 'Survive a whole window un-hit to regain a life (that player only). Any hit heals her.'
  detail: Surviving an entire Insane window without being hit restores 1 Death Count for that player only; any hit on a player during Insane heals Bellona.
- title: Sigils start Berserk
  text: 'Three sigils trigger a three-weapon attack chain.'
  detail: 'Insane drops sigils on the map; once three gather she runs a Berserk weapon sequence of three attacks from sword hilt, single axe, double axe and (Phase 2 only) whirlwind wand.'
- title: Binds skip a state
  text: 'Outside her rampage, a bind flips to the next state.'
  detail: Outside her rampage state, binding her flips Normal and Insane straight to the next state. How the rampage state differs from Berserk is unclear in the sources.
- title: Hidden markers
  text: 'Normal and Hard hide most ranges; Hard is faster.'
  detail: Normal and Hard hide most attack range markers; Hard also runs patterns faster.
mechanics:
- kind: zones
  title: Two states
  zones:
  - {name: Normal, sub: regular patterns, tone: neutral}
  - {name: Insane, sub: red only · she takes +30%, tone: red}
  note: 'About 30s each with no hits.'
- kind: ledger
  title: Gauge and lives (solo values)
  rows:
  - {label: Red hit (Easy/Normal/Hard), value: −200/400/600, direction: down}
  - {label: Purple hit (Easy/Normal/Hard), value: −80/80/160, direction: down}
  - {label: Any red hit · lives, value: −1 Death Count, direction: down}
  - {label: Clean Insane window · lives, value: +1 Death Count, direction: up}
danger:
- title: Double-axe Berserk
  text: 'Hands fill the map (Phase 1 under 50%, all of Phase 2). Bind it or use invincibility.'
  detail: The double-axe Berserk attack (Phase 1 below 50% HP, all of Phase 2) fills the map with hands; cut it with a bind or tank it with an invincibility.
- title: Phase 2 below 50%
  text: 'Pinball adds a final slam (up-jump); the border sequence adds a bottom-centre charge.'
  detail: Phase 2 below 50% HP adds a final slam to the pinball charges (up-jump it) and a bottom-centre charge to the border sequence; both are fast and easy to miss.
- title: Hits snowball
  text: 'One hit invites panicked follow-ups; failed runs lose lives in a row.'
  detail: One hit often leads to panicked follow-up hits; failed runs usually lose several lives in a row.
tips:
- title: Vanish? Crouch first
  text: 'Upright somersault: crouch. Inverted: jump. In Insane, wait for the full red form.'
  detail: When she vanishes (her most frequent move), crouch first. Somersault upright means crouch, inverted means jump; in Insane, wait for the red form to show fully.
- title: Horizontal, vertical, X
  text: 'Crouch, dash through on time (never early), stand still. Call Phase 2''s triple tell aloud.'
  detail: 'Horizontal, vertical, X sequence: crouch, dash through on timing (do not pre-dash), stand still. In Phase 2 all three tells play first, so say them aloud.'
- title: Bottom-centre charge
  text: 'Up-jump. Axe raised: dash behind her. Axe to the side: stay crouched.'
  detail: 'For the Phase 2 bottom-centre charge, up-jump, then react: axe raised means dash behind her, axe held to the side means stay crouched.'
- title: Pinball
  text: 'Default to the left side.'
- title: Read sigils in binds
  text: 'They show the next Berserk sequence.'
  detail: During binds, read the sigils already on the map so you know the next Berserk sequence.
notes:
- title: Not in MapleSEA yet
  text: 'Unreleased as of v254; facts are KMS ver. 1.2.418 (Aug 2026) and may change.'
  detail: Not released in MapleSEA as of v254 (28 Sep 2026); her MapleSEA name and release date are unannounced. Facts are from KMS ver. 1.2.418 (27 Aug 2026) and may differ on release.
- title: Entry and credit
  text: 'Post-OVERDRIVE only. Level 280 and [Solatum] The Truth of Solatum; break the Ark after the kill.'
  detail: 'She was released in KMS after OVERDRIVE, so only post-OVERDRIVE values exist (20-minute limit). Entry needs level 280 and the quest [Solatum] The Truth of Solatum; break the Ark of Solatum after the kill for clear credit.'
- title: Spec unconfirmed
  text: 'From a Namu Wiki summary and a pre-release estimate.'
  detail: Recommended spec ranges come from a search summary of Namu Wiki and a pre-release estimate; unconfirmed.
