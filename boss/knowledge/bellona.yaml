boss: Bellona
summary: 'Bellona is not in MapleSEA yet (KMS 1.2.418, Aug 2026); this is a prep guide. She is a dodge check: red attacks take a life, a shared gauge flips her into Insane mode where she takes +30% damage and hurts herself, and surviving an Insane window un-hit gives a life back.'
core:
- 'Red (Annihilation) attacks remove 1 Death Count and cut the gauge sharply (200/400/600 on Easy/Normal/Hard, solo); purple attacks only cut it a little (80/80/160).'
- 'The 0-1000 gauge is shared by the party and moves about 31 per second, so with no hits each state lasts roughly 30 seconds. In Insane the screen darkens, she only uses red attacks, damages herself with each one and takes 30% more final damage.'
- Surviving an entire Insane window without being hit restores 1 Death Count for that player only; any hit on a player during Insane heals Bellona.
- 'Insane drops sigils on the map; once three gather she runs a Berserk weapon sequence of three attacks from sword hilt, single axe, double axe and (Phase 2 only) whirlwind wand.'
- Outside her rampage state, binding her flips Normal and Insane straight to the next state. How the rampage state differs from Berserk is unclear in the sources.
- Normal and Hard hide most attack range markers; Hard also runs patterns faster.
danger:
- The double-axe Berserk attack (Phase 1 below 50% HP, all of Phase 2) fills the map with hands; cut it with a bind or tank it with an invincibility.
- Phase 2 below 50% HP adds a final slam to the pinball charges (up-jump it) and a bottom-centre charge to the border sequence; both are fast and easy to miss.
- One hit often leads to panicked follow-up hits; failed runs usually lose several lives in a row.
tips:
- When she vanishes (her most frequent move), crouch first. Somersault upright means crouch, inverted means jump; in Insane, wait for the red form to show fully.
- 'Horizontal, vertical, X sequence: crouch, dash through on timing (do not pre-dash), stand still. In Phase 2 all three tells play first, so say them aloud.'
- 'For the Phase 2 bottom-centre charge, up-jump, then react: axe raised means dash behind her, axe held to the side means stay crouched.'
- For pinball, default to the left side.
- During binds, read the sigils already on the map so you know the next Berserk sequence.
notes:
- Not released in MapleSEA as of v254 (28 Sep 2026); her MapleSEA name and release date are unannounced. Facts are from KMS ver. 1.2.418 (27 Aug 2026) and may differ on release.
- She was released in KMS after OVERDRIVE, so only post-OVERDRIVE values exist (20-minute limit). Entry needs level 280 and the quest [Solatum] The Truth of Solatum; break the Ark of Solatum after the kill for clear credit.
- Recommended spec ranges come from a search summary of Namu Wiki and a pre-release estimate; unconfirmed.
