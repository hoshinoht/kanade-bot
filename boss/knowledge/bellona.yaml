strategies:
- name: Dodge first
  when: First clears or below the minimum cut
  risk: low
  damage: high
  payoff: Clean Insane windows come about once a minute and refund lives; slower clear
  steps:
  - Stop attacking during every tell; add damage only once dodges are consistent.
  - Treat each Insane window as a no-hit check; a clean one refunds a life.
  - After a hit, reset and focus on the next tell instead of chasing damage.
- name: Share spare lives
  when: Duo or trio where one member has spare Death Count
  risk: medium
  damage: medium
  payoff: Teammates may refund lives more often (unconfirmed interpretation of the source)
  steps:
  - The gauge is shared but the Insane refund is personal; the member with spare lives may take a pattern on purpose so others can finish Insane clean.
  - Hits during Insane heal Bellona, so only do this when a teammate is short on lives.
