[package]
name = "kanade-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The driver's and allowance's test hooks (`spend_allowance`,
# `with_conversations`, `take_tasks`, …) for other crates' tests.
test-support = []

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
kanade-domain = { path = "../kanade-domain" }
kanade-extract = { path = "../kanade-extract" }
kanade-llm = { path = "../kanade-llm" }
kanade-voice = { path = "../kanade-voice" }
regex = { workspace = true, features = ["std", "unicode-case", "unicode-perl"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
uuid.workspace = true
