[package]
name = "kanade-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Conformance suites, `TempStoreDir`/`open_temp` and the paused-clock hold for
# other crates' tests.
test-support = ["tokio/test-util", "kanade-domain/test-support"]

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
kanade-domain = { path = "../kanade-domain" }
kanade-log = { path = "../kanade-log" }
libc.workspace = true
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
