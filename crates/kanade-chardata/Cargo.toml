[package]
name = "kanade-chardata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Loopback clients (`NexonClient::plain`) and short timeouts for other
# crates' tests.
test-support = []

[dependencies]
chrono.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
kanade-domain = { path = "../kanade-domain" }
kanade-log = { path = "../kanade-log" }
kanade-store = { path = "../kanade-store" }
ring.workspace = true
rustls = { workspace = true, features = ["std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
# Fake Open API and scouter servers on loopback.
axum = { workspace = true, features = ["http1", "tokio"] }
# The tracked boss catalog for the boss key table's test.
kanade-files = { path = "../kanade-files" }
kanade-log = { path = "../kanade-log", features = ["test-support"] }
kanade-store = { path = "../kanade-store", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
