[package]
name = "kanade-files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jsonschema.workspace = true
kanade-domain = { path = "../kanade-domain" }
kanade-log = { path = "../kanade-log" }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }
