name: CI

# Gates merges to master. Runs on pull requests from forks too (this repo is
# public), so nothing here may need a secret.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # The browser e2e (4 shards and motion in parallel, ~10 min) runs only from
  # here, with `e2e` ticked; run the full local check (`bun run e2e`) before
  # merging UI work instead.
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the Playwright end-to-end suites (about 10 minutes)
        type: boolean
        default: false

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each suite runs only when its inputs changed. A job skipped by `if` counts
  # as passed for required checks; editing this workflow runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - .github/workflows/ci.yml
              - src/**
              - tests/**
              # Built by clippy and test --all-targets (the V02 harness).
              - examples/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - deny.toml
              - kanade.example.toml
              - kanade.openai-compatible.example.toml
              - boss/**
              - config/personas/**
              # The lib test checks the generated API types against the DTOs.
              - web/packages/api-types/**
              # The store suite pins the character-data volume there.
              - deploy/compose.yaml
            web:
              - .github/workflows/ci.yml
              - web/**
              # The browser e2e server the suite runs against.
              - examples/e2e_server/**
              - boss/knowledge/**
              - docs/v5/api-schemas/**
              # The route diff compares the web calls with these.
              - src/api/**
              - scripts/api_routes/**

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Release build
        run: cargo build --locked --release

  # Advisories, licences (GPL-3.0-only compatible), bans (no OpenSSL family or
  # aws-lc) and sources for the shipped crate graph (deny.toml).
  supply-chain:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          arguments: --all-features
          command: check

  # Browser smoke tests against the real Rust listener and an invented scratch
  # store, plus the e2e server's own quick specs (e2e/harness/). The fixture and
  # servers all run offline; no private configuration is used.
  rust-e2e:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Build Rust server
        run: cargo build --locked --release
      - name: Build Rust E2E fixture
        run: cargo build --locked --example rust_e2e_fixture --features test-support
      - name: Build Rust E2E harness
        run: cargo build --locked --release --example e2e_server --features test-support
      - name: Install web workspace
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build web apps
        working-directory: web
        run: bun run build
      - name: Rust end-to-end
        working-directory: web
        run: KANADE_E2E_PORT_BASE=5073 bun run e2e:rust
      - name: Harness end-to-end
        working-directory: web
        run: KANADE_E2E_PORT_BASE=5073 KANADE_E2E_WORKERS=2 bun run e2e e2e/harness/
      - name: Keep Rust Playwright traces and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-playwright-results
          path: web/e2e/.results-rust
          include-hidden-files: true
          retention-days: 7

  # The Svelte PWAs (web/); the manual e2e runs them against examples/e2e_server.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every /api/ path the PWAs call must be mounted by src/api (or listed
      # as a documented exception). Source-only Python.
      - name: API route diff
        run: python3 scripts/api_routes/route_diff.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Rust
        if: ${{ inputs.e2e }}
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Audit
        working-directory: web
        run: bun audit --audit-level=high
      - name: Lint
        working-directory: web
        run: bun run lint
      - name: Check
        working-directory: web
        run: bun run check
      - name: Unit tests
        working-directory: web
        run: bun run test
      # Includes the public build's admin-module guard (forbidModules).
      - name: Build
        working-directory: web
        run: bun run build

      # Built once here and shared with the e2e shards, so Playwright's webServer
      # starts a ready binary. Every job checks out to the same path, which the
      # binary's compile-time repo root (tracked catalog, persona, fixtures) needs.
      - name: E2E server build
        if: ${{ inputs.e2e }}
        run: cargo build --locked --release --example e2e_server --features test-support
      - name: Keep the e2e server and the built PWAs
        if: ${{ inputs.e2e }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-build
          path: |
            target/release/examples/e2e_server
            web/apps/admin/dist
            web/apps/public/dist
          retention-days: 1

  # The main e2e project split over 4 runners (CPU-bound in Chrome, so runners,
  # not workers, are what shortens it); each shard runs its own servers.
  e2e:
    needs: web
    if: ${{ inputs.e2e }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build
      - name: Install
        working-directory: web
        run: |
          chmod +x ../target/release/examples/e2e_server
          bun install --frozen-lockfile
      # ubuntu-latest ships Google Chrome, which the suite uses (channel 'chrome');
      # no browser download, no secrets. Boss art is the committed synthetic fixture set.
      - name: End-to-end (shard ${{ matrix.shard }}/4)
        working-directory: web
        env:
          KANADE_E2E_SERVER_BIN: target/release/examples/e2e_server
        run: bun run e2e --project=main --shard=${{ matrix.shard }}/4
      - name: Keep Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: web/e2e/.results
          # `.results` is a hidden directory, which upload-artifact@v4 skips by default.
          include-hidden-files: true
          retention-days: 7

  # Frame-timing checks on their own runner, one worker and one server. Their
  # fps floors are reported, not enforced, on CI.
  e2e-motion:
    needs: web
    if: ${{ inputs.e2e }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build
      - name: Install
        working-directory: web
        run: |
          chmod +x ../target/release/examples/e2e_server
          bun install --frozen-lockfile
      - name: End-to-end (motion)
        working-directory: web
        env:
          KANADE_E2E_WORKERS: '1'
          KANADE_E2E_SERVER_BIN: target/release/examples/e2e_server
        run: bun run e2e --project=motion
      - name: Keep Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-motion
          path: web/e2e/.results
          include-hidden-files: true
          retention-days: 7
