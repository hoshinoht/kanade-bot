name: CI

# Gates merges to master. Runs on pull requests from forks too (this repo is
# public), so nothing here may need a secret.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each suite runs only when its inputs changed. A job skipped by `if` counts
  # as passed for required checks; editing this workflow runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - .github/workflows/ci.yml
              - src/**
              - tests/**
              # Built by clippy and test --all-targets (the V02 harness).
              - examples/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - deny.toml
              - kanade.example.toml
              - boss/**
              - config/personas/**
              - docs/v5/vectors/**
              # The lib test checks the generated API types against the DTOs.
              - web/packages/api-types/**
            web:
              - .github/workflows/ci.yml
              - web/**
              - devtools/pwa-mock/**
              - boss/knowledge/**
              - docs/v5/api-schemas/**
              # The route diff compares the web calls and mock routes with these.
              - src/api/**
              - scripts/api_routes/**

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Release build
        run: cargo build --locked --release

  # Advisories, licences (GPL-3.0-only compatible), bans (no OpenSSL family or
  # aws-lc) and sources for the shipped crate graph (deny.toml).
  supply-chain:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          arguments: --all-features
          command: check

  # Browser smoke tests against the real Rust listener and an invented scratch
  # store. The fixture and server both run offline; no private configuration is used.
  rust-e2e:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Build Rust server
        run: cargo build --locked --release
      - name: Build Rust E2E fixture
        run: cargo build --locked --example rust_e2e_fixture --features test-support
      - name: Install web workspace
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build web apps
        working-directory: web
        run: bun run build
      - name: Rust end-to-end
        working-directory: web
        run: KANADE_E2E_PORT_BASE=5073 bun run e2e:rust
      - name: Keep Rust Playwright traces and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-playwright-results
          path: web/e2e/.results-rust
          include-hidden-files: true
          retention-days: 7

  # The Svelte PWAs (web/) and their dev-only mock server (devtools/pwa-mock).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every /api/ path the PWAs call and the mock serves must be mounted by
      # src/api (or listed as a documented exception). Source-only Python.
      - name: API route diff
        run: python3 scripts/api_routes/route_diff.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Audit
        working-directory: web
        run: bun audit --audit-level=high
      - name: Lint
        working-directory: web
        run: bun run lint
      - name: Check
        working-directory: web
        run: bun run check
      - name: Unit tests
        working-directory: web
        run: bun run test
      # Includes the public build's admin-module guard (forbidModules).
      - name: Build
        working-directory: web
        run: bun run build

      - name: Mock server format
        working-directory: devtools/pwa-mock
        run: cargo fmt --check
      - name: Mock server lint
        working-directory: devtools/pwa-mock
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Mock server tests
        working-directory: devtools/pwa-mock
        run: cargo test --locked
      # Built ahead so Playwright's webServer start stays well inside its timeout.
      - name: Mock server build
        working-directory: devtools/pwa-mock
        run: cargo build --locked --release

      # ubuntu-latest ships Google Chrome, which the suite uses (channel 'chrome');
      # no browser download, no secrets. Boss art is the committed synthetic fixture set.
      - name: End-to-end
        id: e2e
        working-directory: web
        run: bun run e2e --project=main
      # Frame-timing checks run alone, on one worker and one mock, after the rest
      # (also when the main suite failed). Their fps floors are reported, not enforced, on CI.
      - name: End-to-end (motion)
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        working-directory: web
        env:
          KANADE_E2E_WORKERS: '1'
        run: bun run e2e --project=motion --output e2e/.results/motion
      - name: Keep Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/e2e/.results
          # `.results` is a hidden directory, which upload-artifact@v4 skips by default.
          include-hidden-files: true
          retention-days: 7
