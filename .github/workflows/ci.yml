name: CI

# Gates merges to master. Runs on pull requests from forks too (this repo is
# public), so nothing here may need a secret.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each suite runs only when its inputs changed. A job skipped by `if` counts
  # as passed for required checks; editing this workflow runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - .github/workflows/ci.yml
              - src/**
              - tests/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - kanade.example.toml
              - boss/**
              - config/personas/**
              - docs/v5/vectors/**
              # The lib test checks the generated API types against the DTOs.
              - web/packages/api-types/**
            web:
              - .github/workflows/ci.yml
              - web/**
              - tools/pwa-mock/**
              - boss/knowledge/**
              - docs/v5/api-schemas/**

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Release build
        run: cargo build --locked --release

  # The Svelte PWAs (web/) and their dev-only mock server (tools/pwa-mock).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: bun run lint
      - name: Check
        working-directory: web
        run: bun run check
      - name: Unit tests
        working-directory: web
        run: bun run test
      # Includes the public build's admin-module guard (forbidModules).
      - name: Build
        working-directory: web
        run: bun run build

      - name: Mock server format
        working-directory: tools/pwa-mock
        run: cargo fmt --check
      - name: Mock server lint
        working-directory: tools/pwa-mock
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Mock server tests
        working-directory: tools/pwa-mock
        run: cargo test --locked
      # Built ahead so Playwright's webServer start stays well inside its timeout.
      - name: Mock server build
        working-directory: tools/pwa-mock
        run: cargo build --locked --release

      # ubuntu-latest ships Google Chrome, which the suite uses (channel 'chrome');
      # no browser download, no secrets. Boss art is the committed synthetic fixture set.
      - name: End-to-end
        working-directory: web
        run: bun run e2e
      - name: Keep Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/e2e/.results
          retention-days: 7
