<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Boss scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/portal.css">
</head>
<body>
<div class="gate">
  <form class="gate__card" method="post" action="/login">
    <p class="eyebrow">Boss scheduler</p>
    <h1>Sign in</h1>
    <p>Paste <code>ADMIN_TOKEN</code> from <code>.env</code>. The session lasts seven days on this
      device; rotating the token ends every session.</p>
    {% if error %}<p class="flash flash--error">{{ error }}</p>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label><span class="label">Admin token</span>
      <input type="password" name="token" autocomplete="current-password" required autofocus>
    </label>
    <button class="btn btn--primary" type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
