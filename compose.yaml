# Pinned so the project name follows the repo's identity, not the checkout
# directory: the 2026-09-01 rename to kanade-bot showed what happens otherwise
# (compose stops owning the running container and quietly provisions a fresh,
# EMPTY data volume under the new derived name). Data was migrated from
# boss-scheduler-bot_botdata to kanade-bot_botdata the same day.
name: kanade-bot

services:
  bot:
    build: .
    container_name: kanade-bot
    env_file: .env
    environment:
      # Ollama stays native on the host (no Metal passthrough in Docker on macOS).
      # Unused until phase 2, but wired now so nothing changes later.
      OLLAMA_HOST: http://host.docker.internal:11434
      DB_PATH: /app/data/bot.sqlite
      BOSSES_PATH: /app/config/bosses.yaml
      # On the named volume beside the database, so it survives a rebuild and
      # stays out of both the image and git. Put it there with:
      #   docker compose cp your-persona.md bot:/app/data/persona.md
      # Missing, it falls back to the tracked persona.example.md and warns.
      PERSONA_PATH: /app/data/persona.md
      # A container's loopback is its own namespace, so binding 127.0.0.1 here
      # would make the published port unreachable. "Never leaves the host" is
      # enforced by the `ports:` mapping below, not by this value.
      API_HOST: "0.0.0.0"
    extra_hosts: ["host.docker.internal:host-gateway"]
    # LOOPBACK ONLY. Docker accepts connections on the host's 127.0.0.1 and
    # forwards them in; nothing on the LAN can reach the portal. Tailnet access
    # goes through the caddy service below, which replaced `tailscale serve`
    # on 2026-09-01; this mapping stays for host-local CLI and dev use. Never
    # `funnel` or publish wider - that would put the portal on the internet.
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      # Named volume, not a bind mount: SQLite over macOS VirtioFS has weak
      # fsync guarantees, and a hard kill mid-write corrupted the DB once
      # (2026-08-31). Host-side access goes through `docker compose cp`.
      - botdata:/app/data
      # Nested inside the volume above (docker mounts by path depth, so the
      # deeper path wins): the volume is now the only live copy of the schedule,
      # and a copy nobody can see from the host is not much of a backup. The
      # bot writes one snapshot a day here, so `data/backups` on the Mac holds
      # the last fortnight. Consistency comes from SQLite's backup API
      # (`bot.backup`), never from copying the WAL file underneath it.
      - ./data/backups:/app/data/backups
      - ./config:/app/config:ro
    restart: unless-stopped
    # Defense-in-depth: member input never reaches a shell or a URL, but if a
    # parsing dependency ever gave code execution, it lands in a root-immutable,
    # capability-less, resource-capped container. /app/data stays writable via
    # the volume; everything else the process needs at runtime is read-only.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    # An extraction call can run 30-120s; the default 10s grace period
    # SIGKILLs a mid-write shutdown, which is how the DB got corrupted.
    stop_grace_period: 60s
    healthcheck:
      # Checks both halves of the process: the tick loop's SQLite heartbeat and
      # the in-process API answering /healthz.
      test: ["CMD", "python", "-m", "bot.health"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TLS front door for the portal, tailnet-only. Cloudflare holds the A record
  # (the hostname in caddy/Caddyfile -> this host's Tailscale IP, DNS-only) and
  # the token in .env.caddy lets Caddy pass the ACME DNS-01 challenge, so the
  # cert is a real Let's Encrypt one with no port ever opened to the internet.
  # See caddy/Caddyfile.example for setup and why there is no client-IP filter.
  caddy:
    build: caddy
    container_name: kanade-caddy
    # Holds CLOUDFLARE_API_TOKEN (Zone.DNS Edit, scoped to the one zone);
    # untracked via the .env.* gitignore rule.
    env_file: .env.caddy
    # CADDY_BIND_IP (in .env) is the host's Tailscale IP, so 443 is published
    # on that address alone - Docker's privileged backend can do the
    # specific-IP low-port bind that an unprivileged host process cannot
    # (macOS allows non-root <1024 binds only on the wildcard address). If the
    # IP ever changes (device re-added to the tailnet), update .env AND the
    # Cloudflare A record. Docker fails the container start if the IP does not
    # exist yet; `restart: unless-stopped` retries until Tailscale is up. The
    # loopback default keeps a fresh clone off the network entirely.
    ports: ["${CADDY_BIND_IP:-127.0.0.1}:443:443"]
    # Docker's embedded DNS forwards external lookups through the host's
    # resolver chain, i.e. MagicDNS, which failed even the Let's Encrypt
    # directory lookup at issuance time. Service names (`bot`) still resolve
    # via the embedded DNS; only external queries go to these.
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. On a named volume so a rebuild
      # never re-issues (Let's Encrypt rate-limits duplicate certs).
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [bot]
    restart: unless-stopped
    # Same posture as the bot: read-only root, no capabilities beyond the one
    # binding :443 in-container requires, capped resources.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  botdata:
  caddydata:
  caddyconfig:
