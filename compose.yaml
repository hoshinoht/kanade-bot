name: kanade
services:
  bot:
    build: .
    container_name: kanade-bot
    env_file: .env
    environment:
      # Ollama stays on the macOS host for Metal support.
      OLLAMA_HOST: http://host.docker.internal:11434
      DB_PATH: /app/data/bot.sqlite
      BOSSES_PATH: /app/boss/bosses.yaml
      BOSS_KNOWLEDGE_PATH: /app/boss/knowledge
      # Private identity on the host bind mount; missing files use the template.
      PERSONA_PATH: /app/config/personas/identities/persona.md
      # Host exposure is restricted by `ports`, not this container bind address.
      API_HOST: "0.0.0.0"
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Loopback only; tailnet traffic enters through Caddy.
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      # Keep SQLite on a named volume, not macOS VirtioFS.
      - botdata:/app/data
      # Host-visible snapshots created through SQLite's backup API.
      - ./data/backups:/app/data/backups
      - ./config:/app/config:ro
      # Canonical catalog, knowledge, portraits, and entry artwork.
      - ./boss:/app/boss:ro
      # Writable for private identities, behaviours, and portal-managed profiles.
      - ./config/personas:/app/config/personas
    restart: unless-stopped
    # Root stays immutable; only mounted data and config/personas are writable.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    # Allow in-flight extraction and SQLite writes to finish.
    stop_grace_period: 60s
    healthcheck:
      # Checks the SQLite heartbeat and in-process API.
      test: ["CMD", "python", "-m", "bot.health"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Tailnet-only TLS front door; see caddy/Caddyfile.example.
  caddy:
    build: caddy
    container_name: kanade-caddy
    # Holds the zone-scoped CLOUDFLARE_API_TOKEN.
    env_file: .env.caddy
    # Bind only the Tailscale IP; loopback is the safe fresh-clone default.
    ports: ["${CADDY_BIND_IP:-127.0.0.1}:443:443"]
    # Avoid MagicDNS failures during ACME lookups; service DNS still works.
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Preserve certificates and ACME account keys across rebuilds.
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [bot]
    restart: unless-stopped
    # Only the capability required to bind :443 is retained.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  botdata:
    name: kanade_botdata
    external: true
  caddydata:
    name: kanade_caddydata
    external: true
  caddyconfig:
    name: kanade_caddyconfig
    external: true
