services:
  bot:
    build: .
    container_name: boss-scheduler-bot
    env_file: .env
    environment:
      # Ollama stays native on the host (no Metal passthrough in Docker on macOS).
      # Unused until phase 2, but wired now so nothing changes later.
      OLLAMA_HOST: http://host.docker.internal:11434
      DB_PATH: /app/data/bot.sqlite
      BOSSES_PATH: /app/config/bosses.yaml
      # A container's loopback is its own namespace, so binding 127.0.0.1 here
      # would make the published port unreachable. "Never leaves this Mac" is
      # enforced by the `ports:` mapping below, not by this value.
      API_HOST: "0.0.0.0"
    extra_hosts: ["host.docker.internal:host-gateway"]
    # LOOPBACK ONLY. Docker accepts connections on the host's 127.0.0.1 and
    # forwards them in; nothing on the LAN can reach the portal. Reach it from
    # the tailnet with `tailscale serve --bg 8080` on the host - never `funnel`,
    # which would publish it to the internet. See README "Portal & CLI".
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      # Checks both halves of the process: the tick loop's SQLite heartbeat and
      # the in-process API answering /healthz.
      test: ["CMD", "python", "-m", "bot.health"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
