# Kanade v5. Run every command from this directory (deploy/), without -f:
#   docker compose up -d
# Compose then also loads compose.override.yaml here when present (git-ignored;
# template: compose.override.example.yaml) and .env (template: .env.example).
# Runbook: deploy/README.md.
name: kanade-v5
services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        KANADE_IMAGE_REVISION: ${KANADE_IMAGE_REVISION:-unknown}
        KANADE_IMAGE_VERSION: ${KANADE_IMAGE_VERSION:-dev}
        KANADE_IMAGE_SOURCE: ${KANADE_IMAGE_SOURCE:-https://github.com/hoshinoht/kanade-bot}
    image: kanade-v5:local
    container_name: kanade-v5
    # Live serve: owns the store and connects the gateway.
    command: ["serve"]
    # Settings live in the private ../kanade.toml (template: kanade.example.toml),
    # mounted below; paths inside the image come from the Dockerfile. Only the
    # network addresses are set here (a reverse proxy moves the admin ones in
    # compose.override.yaml).
    environment:
      KANADE_CONFIG: /config/kanade.toml
      KANADE_ALLOW_PRIVATE_BIND: "1"
      # `restart: unless-stopped` below starts the bot again after Setup's
      # "Restart now" exits it.
      KANADE_SUPERVISED: "1"
      # The bot's fixed address on the admin network, published on the host's
      # loopback below. `kanade healthcheck` targets it.
      KANADE_ADMIN_BIND: 172.23.0.10:8080
      # The public listener's fixed address and cloudflared's, on
      # kanade_public. The listener stays off until kanade.toml sets
      # public.host (runbook "Public portal").
      KANADE_PUBLIC_BIND: 172.25.0.10:8081
      KANADE_CLOUDFLARED_PEER: 172.25.0.3
    networks:
      # Egress for Discord and the model gateway (Kanata or another
      # OpenAI-compatible server), and the admin listener.
      admin:
        ipv4_address: 172.23.0.10
      # Internal; only cloudflared joins. Unused until public.host is set.
      public:
        ipv4_address: 172.25.0.10
    # The admin portal on the host's loopback only (http://localhost:8080);
    # the public listener is never published.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # SQLite on a named volume, not a macOS bind mount.
      - data:/data
      # Module character_data's own file, never in the data volume or backups.
      - chardata:/chardata
      - ../config/personas:/config/personas:ro
      # Fails the start when the file is missing instead of creating a directory.
      - type: bind
        source: ${KANADE_CONFIG_FILE:-../kanade.toml}
        target: /config/kanade.toml
        read_only: true
        bind:
          create_host_path: false
      # Private art (git-ignored) stays on the host.
      - ../boss/portraits:/app/boss/portraits:ro
      - ../boss/artwork:/app/boss/artwork:ro
      # `kanade backup` snapshots and manifests (and the volume tarballs),
      # plus the optional age `recipients` file. Compose does not expand `~`;
      # the directory must already exist.
      - type: bind
        source: ${KANADE_BACKUP_HOST_DIR:-${HOME}/.config/kanade/v5/backups}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
      # The secrets directory: one file per secret under a fixed name
      # (runbook "Secrets"); a file no feature uses is ignored. It must
      # already exist.
      - type: bind
        source: ${KANADE_SECRETS_HOST_DIR:-${HOME}/.config/kanade/v5/secrets}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    # serve's fixed 25 s shutdown budget plus a 5 s margin (KANADE_SHUTDOWN_TIMEOUT_SECONDS caps only the HTTP drain inside it).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/kanade", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Deploy-time store snapshot; never started by `up` (profile). Run it only
  # while `bot` is stopped (the owner lock refuses otherwise), with the image
  # that last served the store so no migration runs first:
  #   KANADE_BACKUP_IMAGE=kanade-v5:rollback-<sha> docker compose \
  #     --profile backup run --rm backup backup --name kanade-<stamp>-pre-<sha>.sqlite
  # With a `recipients` file in the backups directory it writes <name>.age.
  backup:
    image: ${KANADE_BACKUP_IMAGE:-kanade-v5:local}
    profiles: [backup]
    command: ["backup"]
    # The store and the backups directory only (paths from the image): no
    # settings file, secrets or network.
    network_mode: none
    volumes:
      - data:/data
      - type: bind
        source: ${KANADE_BACKUP_HOST_DIR:-${HOME}/.config/kanade/v5/backups}
        target: /backups
        bind:
          create_host_path: false
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128

  # Public portal ingress; never started by `up` (profile). Cloudflare tunnel
  # (remotely managed, token file) -> bot's public listener on kanade_public.
  # Runbook: deploy/README.md "Public portal".
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    pull_policy: missing
    profiles: [public]
    container_name: kanade-v5-cloudflared
    entrypoint: ["cloudflared", "--no-autoupdate"]
    # Metrics stay on container loopback; debug logging would record headers.
    command:
      - tunnel
      - --loglevel
      - info
      - --metrics
      - 127.0.0.1:20241
      - run
      - --token-file
      - /run/secrets/kanade_cloudflared_token
    user: "65532:65532"
    secrets:
      - kanade_cloudflared_token
    networks:
      public:
        ipv4_address: 172.25.0.3
      tunnel_egress:
        gw_priority: 100
    # No published ports.
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Fixed subnets, so each listener binds a fixed address. They are not
# reserved: if one overlaps a network already on the host (`docker network
# inspect`), change it here with the addresses that use it.
networks:
  # The bot's egress and the admin listener (published on 127.0.0.1:8080).
  admin:
    name: kanade_admin
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
  # bot <-> cloudflared only; internal (no egress).
  public:
    name: kanade_public
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.25.0.0/24
  # cloudflared's own egress to Cloudflare, separate from the bot's.
  tunnel_egress:
    name: kanade_tunnel_egress
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24

secrets:
  # Tunnel token (profile public only), one line, kept outside the bot's
  # secrets directory; never an env var or command argument.
  kanade_cloudflared_token:
    file: ${KANADE_CLOUDFLARED_TOKEN_HOST_FILE:-${HOME}/.config/kanade/v5/cloudflared_token}

volumes:
  data:
    name: kanade_v5_data
  # Module character_data's file (NEXON Open API data): its own volume, so
  # the `kanade_v5_data` tarball and `kanade backup` never hold it.
  chardata:
    name: kanade_v5_chardata
