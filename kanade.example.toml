# Copy to kanade.toml (git-ignored) in the repository root; deploy/compose.yaml
# mounts it at /config/kanade.toml. Secrets are files in the secrets
# directory, never here; paths and addresses come from the image and Compose.
#
# - The uncommented keys are the whole requirement; fill in yours. Commented
#   keys show their default or an optional add-on. All values are placeholders.
# - Live settings (channels, switches, pings, run lengths, model roles and
#   context, persona) are saved in the admin app's Config, not here.
# - Unknown and removed keys, wrong types and secret-looking keys stop startup
#   naming the key (and where a removed key's value lives now), never the
#   value. docs/v5/runtime-bootstrap.md lists every key.

[runtime]
# IANA timezone.
timezone = "Asia/Kuala_Lumpur"
# At most 64 of [A-Za-z0-9._-]; default kanade-<random>.
# instance_id = "kanade-example"
# Scheduler tick, 5-300 seconds.
# tick_seconds = 30
# HTTP drain on SIGTERM, 1-120 seconds.
# shutdown_timeout_seconds = 10
# `kanade healthcheck` timeout, 1-30 seconds; it checks the admin listener.
# healthcheck_timeout_seconds = 3
# Boss week reset: mon..sun and HH:MM (24-hour); default Thursday 00:00. Used
# only while no value is saved in the store.
# boss_week_reset_weekday = "thu"
# boss_week_reset_time = "00:00"

[discord]
# Your server and the role whose members play bossing runs. Snowflakes, as
# strings (or integers). The bot token is the secrets file `discord_token`.
guild_id = "123456789012345678"
bossing_role_id = "223456789012345678"
# false serves the admin API only (no gateway, roster sync or tick).
# gateway = true
# admin_role_id = "323456789012345678"
# chat_pilot_role_id = "423456789012345678"
# debug_user_ids = []
# Where `/debug ping` and `/debug header` post without `channel:`; unset:
# a run's home channel (samples and `/debug header`: the invoking channel).
# A run's test card posted elsewhere than its home channel is display only.
# test_channel = "523456789012345678"

[models]
# Optional: unset turns every model feature off. The OpenAI-compatible model
# gateway (Kanata or another server): https, or http only to loopback,
# localhost or host.docker.internal. Its bearer key is the secrets file
# `model_api_key` and a CA bundle replacing the compiled roots
# `model_ca.pem`, each used when present.
base_url = "https://kanata.example/v1"
# Concurrent calls in the single `gateway` group, 1-16. Exclusive with
# groups, which replace that group.
# permits = 2
# Capacity groups: aliases sharing hardware share permits (1-16). A role
# whose alias is in no group has its calls refused. The table form
# [[models.groups]] works too.
# groups = [{ name = "local", permits = 2, aliases = ["kanata/extract", "kanata/chat"] }]
# Capability declarations for aliases whose listing publishes no Kanata
# metadata (another OpenAI-compatible server); Kanata's published metadata
# always wins. See kanade.openai-compatible.example.toml for the fields.
# capabilities = { "example-plain-model" = { structured_output = true, function_tools = true } }
# Configured external models receive raw member names, IDs, message text and
# URLs; a provider's retention terms concern retention, not transmission.

# Optional add-ons (deploy/README.md "Add-ons"), each a key or two plus,
# where noted, one secrets file.

[admin]
# Behind a reverse proxy: the exact host[:port] served; unset accepts only
# localhost names (http://localhost:8080).
# host = "kanade.example"
# Admin Discord sign-in (needs host; + secrets file `discord_client_secret`).
# Register https://<host>/api/admin/auth/discord/callback with Discord.
# discord_client_id = "123456789012345678"
# Tailscale logins (needs KANADE_TRUSTED_PROXY in the Compose override and
# the secrets file `edge_secret`).
# tailscale_logins = ["someone@example.com"]
# Session idle timeout (5-720 minutes) and absolute lifetime (1-168 hours).
# session_idle_minutes = 60
# session_absolute_hours = 12

[public]
# The member portal: host turns the public listener on (Compose fixes its
# address and the tunnel's).
# host = "kanade-public.example"
# Member sign-in, the public origin's own Discord application (+ secrets file
# `public_discord_client_secret`); register
# https://<host>/api/public/auth/discord/callback. Without it the portal
# stays closed whatever Config › Self-service says.
# discord_client_id = "623456789012345678"
# Member sessions: idle timeout (5-60 minutes), absolute lifetime (1-24
# hours) and the fresh-write window (5-30 minutes); fresh <= idle <= absolute.
# session_idle_minutes = 30
# session_absolute_hours = 8
# fresh_write_minutes = 15

[modules]
# Read at startup (a restart applies a change). roster: the manual character
# roster (off: its routes answer 404; stored characters are kept).
# roster = false
# character_data: NEXON Open API data for linked roster characters (needs
# roster; + secrets file `nexon_api_key`, without which links are refused).
# character_data = false
# guides: the guide publisher (admin Guides routes and the publish worker).
# guides = false

[character_data]
# The private scouter sidecar for clear-time estimates: plain http to a
# loopback, private or single-label host; no secret. Unset: every estimate
# feature is off and the rest runs unchanged.
# scouter_url = "http://scouter:8091"
