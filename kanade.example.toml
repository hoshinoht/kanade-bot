# Kanade v5 settings. Copy to the private, git-ignored `kanade.toml` in the
# repository root; deploy/compose.yaml mounts it at /config/kanade.toml
# (KANADE_CONFIG).
#
# Rules:
# - Non-secret settings only. Secrets stay in one-line files named by `*_file`
#   keys; a key that looks like a secret (token, secret, key, password without
#   `_file`) stops startup.
# - Any non-empty KANADE_* environment variable overrides its key here (the
#   table in docs/v5/runtime-bootstrap.md maps each key to its variable).
#   deploy/compose.yaml sets the listener addresses, the healthcheck URL and
#   every container path, so those keys matter only outside Compose.
# - Unknown keys and bad values stop startup naming the key, never the value.
# - The uncommented keys are all deploy/compose.yaml needs; fill in yours.
#   Commented keys show their default or an optional feature. All values are
#   placeholders.

[runtime]
# IANA timezone (required).
timezone = "Asia/Kuala_Lumpur"
# At most 64 of [A-Za-z0-9._-]; default kanade-<random>.
# instance_id = "kanade-example"
# Scheduler tick, 5-300.
# tick_seconds = 30
# HTTP drain on SIGTERM, 1-120.
# shutdown_timeout_seconds = 10
# true lets listeners bind a private address (internal container network).
# allow_private_bind = false
# Target of `kanade healthcheck`: the admin listener's /healthz.
# healthcheck_url = "http://127.0.0.1:8080/healthz"
# healthcheck_timeout_seconds = 3

[admin]
# Admin listener, loopback (or private with allow_private_bind).
# bind = "127.0.0.1:8080"
# Exact host[:port] served behind a reverse proxy; unset accepts only
# localhost names (http://localhost:8080).
# host = "kanade.example"
# The reverse proxy's address, allowed to send forwarding headers, and the
# optional secret it proves itself with.
# trusted_proxy = "10.89.0.2"
# edge_secret_file = "/run/secrets/kanade_edge_secret"
# Web workspace root (apps/admin/dist, apps/public/dist) and private art.
# web_dir = "/app/web"
# boss_dir = "/app/boss"
# identity_dir = "/app/identity"
# Break-glass sign-in token file (at least 32 bytes).
token_file = "/run/secrets/kanade_admin_token"
# Discord sign-in (runbook "Admin Discord sign-in"): all three or none, and
# they need host; the redirect must be exactly
# https://<admin.host>/api/admin/auth/discord/callback.
# discord_client_id = "123456789012345678"
# discord_client_secret_file = "/run/secrets/kanade_discord_client_secret"
# discord_redirect_uri = "https://kanade.example/api/admin/auth/discord/callback"
# Tailscale logins (needs a non-loopback trusted_proxy and edge_secret_file).
# tailscale_logins = ["someone@example.com"]
# Session idle timeout (5-720 minutes) and absolute lifetime (1-168 hours).
# session_idle_minutes = 60
# session_absolute_hours = 12

[public]
# The public listener exists only when bind is set; host is then required.
# bind = "127.0.0.1:8081"
# host = "kanade-public.example"
# cloudflared_peer = "127.0.0.1"
# Member sign-in, the public origin's own Discord application: all three or
# none, and they need host; the redirect must be exactly
# https://<public.host>/api/public/auth/discord/callback. Without them the
# portal stays closed whatever the admin Config switch
# self_service.public_portal says (that switch opens and closes it live).
# discord_client_id = "623456789012345678"
# discord_client_secret_file = "/run/secrets/public_discord_client_secret"
# discord_redirect_uri = "https://kanade-public.example/api/public/auth/discord/callback"
# Member sessions: idle timeout (5-60 minutes), absolute lifetime (1-24
# hours) and the fresh-write window (5-30 minutes); fresh <= idle <= absolute.
# session_idle_minutes = 30
# session_absolute_hours = 8
# fresh_write_minutes = 15

[discord]
# Bot token file (required).
token_file = "/run/secrets/kanade_discord_token"
# false serves the admin API only (no gateway, roster sync or tick).
# gateway = true
# Your server and the role whose members play bossing runs (required).
# Snowflakes, as strings (or integers).
guild_id = "123456789012345678"
bossing_role_id = "223456789012345678"
# admin_role_id = "323456789012345678"
# chat_pilot_role_id = "423456789012345678"
# debug_user_ids = []
# Where `/debug ping` and `/debug header` post without `channel:`; unset:
# a run's home channel (samples and `/debug header`: the invoking channel).
# A run's test card posted elsewhere than its home channel is display only.
# test_channel = "523456789012345678"

[store]
# Required outside Compose. Absolute paths without `..`.
# db_path = "/data/db/kanade.sqlite"
# owner_lock_dir = "/data/run"

[backup]
# age public keys (age1…, one per line, # comments): `kanade backup` then
# writes <name>.age; a bad or empty file stops startup. Unset: plaintext.
# Compose sets it when KANADE_BACKUP_RECIPIENTS_HOST_FILE is set.
# recipients_file = "/run/secrets/backup_recipients"

[files]
# catalog_file = "boss/bosses.yaml"
# knowledge_dir = "boss/knowledge"
# persona_dir = "config/personas"

[modules]
# Optional modules, read at startup (a restart applies a change). roster:
# the manual character roster's admin routes (off: they answer 404; stored
# characters are kept either way).
# roster = false
# character_data: NEXON Open API data for linked roster characters (needs
# roster; off: its routes answer 404, no task runs and no file is opened).
# character_data = false
# guides: the guide publisher (admin Guides routes and the publish worker;
# off: the routes answer 404 and no worker runs; stored guides are kept).
# guides = false

[character_data]
# Required while the module is on: its own SQLite file, outside the store
# and its backups (Compose sets /chardata/db/chardata.sqlite). Its directory
# is created 0700 when absent; an existing one must already be private.
# db_path = "/chardata/db/chardata.sqlite"
# The Open API key (one line). Unset: links are refused; set but
# unreadable: startup is refused.
# nexon_key_file = "/run/secrets/nexon_api_key"
# The private scouter sidecar for clear-time estimates (admins; members for
# their own characters). Plain http to a loopback, private or single-label host;
# no secret. Unset: estimates off.
# scouter_url = "http://scouter:8091"

[models]
# The model gateway (required with Compose, which always sets key_file):
# https, or http only to loopback, localhost or host.docker.internal.
base_url = "https://kanata.example/v1"
# Bearer key file and an optional CA bundle replacing the compiled roots.
key_file = "/run/secrets/kanade_model_api_key"
# ca_file = "/run/kanade/kanata-ca.pem"
# Concurrent calls in the single `gateway` group, 1-16 (default 2). Exclusive
# with groups, which replace that group.
# permits = 2
# Configured external models receive raw member names, IDs, message text and
# URLs. Kanata provider ZDR concerns retention, not transmission. The retired
# pseudonymize and allow_external_unmasked keys are rejected if present.

# Capacity groups: aliases sharing hardware share permits (1-16). A role
# whose alias is in no group has its calls refused. The table form
# [[models.groups]] works too.
# groups = [{ name = "local", permits = 2, aliases = ["kanata/extract", "kanata/chat"] }]

# Capability declarations for aliases whose listing publishes no Kanata
# metadata (another OpenAI-compatible server); Kanata's published metadata
# always wins. Fields: structured_output, function_tools, sampling_controls,
# reasoning_control, reasoning_efforts, context_tokens, max_output_tokens.
# See kanade.openai-compatible.example.toml for the table form.
# capabilities = { "example-plain-model" = { structured_output = true, function_tools = true } }

# Context seeds apply only until `v5.model_context` is saved through Config
# (then the saved row wins and edits apply live to the next call). All keys
# but `cap` and `overrides` are required. A window (default, cap, override)
# above 131072 is clamped to 131072 with a startup warning; a zero value or a
# reserve not smaller than its role's window (its cap, else the smaller zone
# default) refuses startup, as does a reserve of 15360 or more: every model
# call reserves its prompt estimate plus max_tokens out of a 16384-token
# budget, and at least 1024 of it must stay for the prompt (the Config API
# refuses the same with 422). Reserves are sent as max_tokens, clamped to the
# route's published output maximum. Local routes over 16384 warn but run.
# Override keys match aliases exactly: an override on "kanata/chat" does not
# apply to a "kanata/chat:high" variant. The table form [models.context]
# (with [models.context.chat] and so on) works too.
# context = { cloud_default = 65536, local_default = 8192, overrides = { "example-cloud-model" = 32768 }, chat = { reserve = 1024, cap = 65536 }, extraction = { reserve = 2500 }, rewrite = { reserve = 96 } }

# Per-role seeds, used only where no saved setting exists. Reasoning: off,
# minimal, low, medium, high, xhigh, max; chat and rewrite also inherit.
[models.extraction]
# model = "kanata/extract"
# reasoning = "off"

[models.chat]
# model = "kanata/chat"
# reasoning = "inherit"

[models.rewrite]
# model = "kanata/chat"
# reasoning = "inherit"

# Starting settings: applied only where the store has no saved value.
[settings]
# post_channel_id = "523456789012345678"
# watch_channel_ids = []
# watch_category_ids = []
# chat_category_ids = []
# extraction_enabled = false
# chat_enabled = false
# Boss week reset: mon..sun and HH:MM (24-hour).
# boss_week_reset_weekday = "thu"
# boss_week_reset_time = "00:00"
# day_of_ping_time = "09:00"
# Countdown reminders in minutes.
# countdown_minutes = [60, 15]
# Planner run lengths seed only while `v5.run_lengths` is unsaved. Every run
# totals one duration per boss; own-time runs have the same duration. The
# default is 5-240 minutes and overrides are 5-480. Each override must use an
# exact catalog boss key and that boss's lowercase difficulty letter.
# run_lengths = { default_minutes = 30, overrides = [{ boss = "BM", difficulty = "h", minutes = 60 }] }
