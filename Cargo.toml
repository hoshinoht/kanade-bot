[package]
name = "kanade"
version = "1.0.0-beta.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[features]
test-support = ["tokio/test-util"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "=0.4.45", default-features = false }
chrono-tz = "=0.10.4"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "tokio"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
jsonschema = { version = "=0.40.0", default-features = false }
libc = { version = "=0.2.189", default-features = false }
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
ring = { version = "=0.17.14", default-features = false }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false }
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse", "serde"] }
twilight-gateway = { version = "=0.17.1", default-features = false, features = ["rustls-platform-verifier"] }
twilight-http = { version = "=0.17.1", default-features = false, features = ["rustls-platform-verifier"] }
twilight-model = { version = "=0.17.1", default-features = false }
uuid = { version = "=1.26.1", default-features = false, features = ["v4"] }
webpki-roots = { version = "=1.0.9", default-features = false }

[dev-dependencies]
# Generates web/packages/api-types/src/generated.ts from the API DTOs (unit test only).
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat"] }

[[test]]
name = "provider_contract"
path = "tests/provider/main.rs"
required-features = ["test-support"]

[[test]]
name = "governor"
path = "tests/governor/main.rs"
required-features = ["test-support"]

[[test]]
name = "scheduler"
path = "tests/scheduler/main.rs"
required-features = ["test-support"]

[[test]]
name = "store"
path = "tests/store/main.rs"
required-features = ["test-support"]

[[test]]
name = "notify"
path = "tests/notify/main.rs"
required-features = ["test-support"]

[[test]]
name = "discord"
path = "tests/discord/main.rs"
required-features = ["test-support"]

[[test]]
name = "delivery"
path = "tests/delivery/main.rs"
required-features = ["test-support"]

[[test]]
name = "extract"
path = "tests/extract/main.rs"
required-features = ["test-support"]

[[test]]
name = "api"
path = "tests/api/main.rs"
required-features = ["test-support"]

[[test]]
name = "chat"
path = "tests/chat/main.rs"
required-features = ["test-support"]
