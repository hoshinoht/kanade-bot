[project]
name = "boss-scheduler-bot"
version = "0.1.0"
description = "Discord bot that keeps a MapleStory guild's weekly boss schedule and posts tagged reminders."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord-py==2.7.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "dateparser==1.4.2",
    "PyYAML==6.0.3",
    "ollama==0.6.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not ollama'"
markers = [
    "ollama: hits the real local model; slow. Run with `uv run pytest -m ollama`.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
