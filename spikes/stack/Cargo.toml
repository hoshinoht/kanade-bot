[package]
name = "kanade-stack-spike"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
futures-util = "0.3.34"
rcgen = "0.14.7"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono"] }
tokio = { version = "1.50.0", features = ["io-util", "macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-rustls = "0.26.5"
tokio-tungstenite = "0.28.0"
tower-http = { version = "0.6.8", features = ["fs"] }
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"

[dev-dependencies]
tempfile = "3.25.0"
