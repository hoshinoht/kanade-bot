# Boss display entries for the guide.
# Copy this file to guide_bosses.yaml and edit to match your server.
#
# Each entry needs:
#   name     – display name (e.g. "Chosen Seren")
#   level    – boss level
#   tokens   – valid difficulty tokens (e.g. [nseren, hseren, xseren])
#   named    – human-readable difficulty list
#   aliases  – comma-separated nicknames the bot recognises
#   portrait – filename stem for config/portraits/icon/<stem>.png
#
# The CLI reads this file to generate the boss section of the guide
# and attaches the matching portrait PNGs as Discord file uploads.

bosses:
